# NereusFishing by naook1/adityap
developer: naook1/adityap
small-caps: true            # nama dan lore otomatis small caps

# true  = joran vanilla biasa juga dapat ikan custom
# false = hanya joran Nereus (dari /fish give)
vanilla-rods-too: false

sell-multiplier: 1.0        # kali harga jual (misal 1.5 saat event)

# Minigame menarik ikan: setelah ikan menggigit, klik kanan saat kursor ada di zona hijau.
# Per rarity: hits = berapa kali harus kena, zone = lebar zona hijau (dari bar), speed = kecepatan kursor.
# color = warna boss bar (petunjuk rarity ikan yang sedang ditarik).
# Sampah (JUNK) tidak ada minigame. enabled: false = langsung dapat ikan seperti biasa.
minigame:
  enabled: true
  bar-length: 21
  lives: 2                  # boleh meleset sebanyak ini sebelum ikan lepas
  timeout-seconds: 14
  difficulty:
    COMMON:    {hits: 1, zone: 7, speed: 1, color: WHITE}
    RARE:      {hits: 2, zone: 5, speed: 1, color: BLUE}
    EPIC:      {hits: 3, zone: 4, speed: 2, color: PURPLE}
    LEGENDARY: {hits: 4, zone: 3, speed: 2, color: YELLOW}

# Rarity: weight = peluang dasar, luck-boost = seberapa besar luck joran menaikkan peluangnya
# (peluang = weight * (1 + luck * luck-boost)). Boleh negatif untuk menurunkan peluang ikan umum.
rarities:
  COMMON:
    name: "&fUmum"
    weight: 60
    luck-boost: -0.1
    broadcast: false
  RARE:
    name: "&9Langka"
    weight: 25
    luck-boost: 0.25
    broadcast: false
  EPIC:
    name: "&5Epik"
    weight: 12
    luck-boost: 0.5
    broadcast: false
  LEGENDARY:
    name: "&6Legendaris"
    weight: 3
    luck-boost: 1.0
    broadcast: true         # diumumkan ke semua pemain
  JUNK:
    name: "&8Sampah"
    weight: 12
    luck-boost: -0.6        # joran bagus = makin jarang dapat sampah
    broadcast: false
    junk: true              # tidak masuk rekor /fish top

# control = tambahan lebar zona hijau di minigame menarik ikan.
# Joran. model = custom_model_data (0 = tampilan vanilla). Model 7011-7014 = tampilan joran di resource pack.
# luck = bonus peluang rarity, speed = persen lebih cepat menggigit (maks 90).
rods:
  wood:
    name: "&fJoran Kayu"
    material: FISHING_ROD
    model: 7011
    luck: 0
    speed: 0
    control: 0
    lore:
      - "&7Joran dasar untuk pemula."
  iron:
    name: "&7Joran Besi"
    material: FISHING_ROD
    model: 7012
    luck: 1
    speed: 10
    control: 1
    lore:
      - "&7Lebih cepat dan sedikit beruntung."
  gold:
    name: "&6Joran Emas"
    material: FISHING_ROD
    model: 7013
    luck: 2
    speed: 20
    control: 1
    lore:
      - "&7Ikan langka lebih sering muncul."
  leviathan:
    name: "&b&lJoran Leviathan"
    material: FISHING_ROD
    model: 7014
    luck: 4
    speed: 35
    control: 2
    lore:
      - "&7Joran legenda dari dasar laut."

