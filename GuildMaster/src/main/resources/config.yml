# ============================================================
# GuildMaster - konfigurasi utama
# Teks dialog ada di dialogue.yml, pesan di messages.yml, tampilan menu di gui/*.yml.
# Setelah mengubah file, jalankan /guildmaster reload.
# ============================================================

# --- NPC Guild Master (FancyNpcs) ---------------------------
# GuildMaster TIDAK membuat NPC. Buat NPC dengan FancyNpcs (/npc create <nama>), lalu tulis ID atau
# namanya di sini. Klik NPC itu membuka dialog.
npc:
  ids:
    - guildmaster
  # Klik yang membuka dialog: ANY_CLICK (kiri/kanan), RIGHT_CLICK, atau LEFT_CLICK.
  click: ANY_CLICK
  # Jarak maksimal pemain dari NPC (blok) supaya klik dihitung. Mencegah klik jarak jauh.
  max-distance: 8.0
  click-cooldown-ms: 1200

# --- Registrasi Adventurer ----------------------------------
registration:
  # Rank Nereus RPG minimum untuk mendaftar (F = rank terendah, jadi semua pemain RPG boleh).
  # Isi dengan kunci rank di NereusRpg: F, E, D, C, B, A, S, SS, SSS.
  min-rank: F

# --- Akses tanpa NPC ----------------------------------------
commands:
  # false: pemain biasa hanya bisa memakai guild lewat NPC. Admin selalu bisa /guildmaster talk dan menu.
  player-direct-access: false

# --- Tampilan -----------------------------------------------
# Format tanggal (Java SimpleDateFormat).
date-format: "dd MMM yyyy"

dialogue:
  # Lebar tombol di popup Java (120 sampai 300).
  button-width: 220

gui:
  # Jeda minimal antar klik di menu (milidetik). Mencegah klik beruntun.
  click-cooldown-ms: 200

# --- Database ------------------------------------------------
# sqlite (bawaan, file di plugins/GuildMaster/data/) atau mysql (juga untuk MariaDB).
# Yang disimpan hanya catatan registrasi. Quest, XP, dan rank tetap di Nereus RPG.
database:
  type: sqlite
  file: guildmaster.db
  # Hanya untuk mysql:
  host: localhost
  port: 3306
  name: guildmaster
  user: root
  password: ""
  options: "useSSL=false&characterEncoding=utf8"
