name: GuildMaster
version: '${project.version}'
main: com.nereus.guildmaster.GuildMaster
api-version: '1.21'
description: Antarmuka Adventurer Guild untuk Nereus MC
authors: [Nereus MC]
# NereusRpg dan FancyNpcs lunak: plugin tetap hidup tanpa keduanya dan memberi peringatan jelas.
softdepend: [NereusRpg, ODailyQuests, FancyNpcs, PlaceholderAPI, floodgate, LuckPerms, Vault]

commands:
  guildmaster:
    description: Adventurer Guild (admin dan dialog)
    usage: /guildmaster [reload|info|register|unregister|reset|talk|menu]
    aliases: [gmaster]
    permission: guildmaster.use

permissions:
  guildmaster.use:
    description: Memakai layanan Adventurer Guild lewat NPC
    default: true
  guildmaster.admin:
    description: Semua perintah admin GuildMaster
    default: op
    children:
      guildmaster.admin.reload: true
      guildmaster.admin.register: true
      guildmaster.admin.reset: true
  guildmaster.admin.reload:
    description: /guildmaster reload dan /guildmaster info
    default: op
  guildmaster.admin.register:
    description: /guildmaster register dan unregister
    default: op
  guildmaster.admin.reset:
    description: /guildmaster reset
    default: op
