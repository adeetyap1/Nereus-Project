# Papan Quest: daftar quest dari Nereus RPG (6 baris). Baris bawah = navigasi.
# Placeholder entri: %name% %rank% %objective% %state% %type%  dan baris %rewards% (lore multi-baris)
title: "&8Papan Quest"
filler: {enabled: true, material: GRAY_STAINED_GLASS_PANE, name: " "}
challenge-label: "&c(Tantangan)"
states:
  available: "&aTersedia"
  active: "&eSedang berjalan"
  done: "&7Selesai hari ini"
entry:
  name: "%rank% &f%name% %type%"
  lore:
    - "&7Tugas: &f%objective%"
    - "&7Status: %state%"
    - ""
    - "&3Hadiah:"
    - "%rewards%"
    - ""
    - "&eKlik untuk detail"
nav:
  prev: {slot: 45, material: ARROW, name: "&7Halaman sebelumnya"}
  back: {slot: 49, material: BARRIER, name: "&cKembali ke menu"}
  next: {slot: 53, material: ARROW, name: "&7Halaman berikutnya"}
  info:
    slot: 47
    material: CLOCK
    name: "&6Quest harian"
    lore:
      - "&7Halaman &f%page%&7/&f%pages%"
      - "&7Aktif: &f%active%&7/&f%active_max%"
      - "&7Selesai hari ini: &f%today%&7/&f%daily_limit%"
      - "&8Reset tengah malam."
empty:
  slot: 22
  material: BARRIER
  name: "&7Tidak ada quest tersedia"
# Layar detail quest (3 baris)
detail:
  title: "&8Detail Quest"
  rows: 3
  filler: {enabled: true, material: GRAY_STAINED_GLASS_PANE, name: " "}
  info:
    slot: 13
    name: "%rank% &f%name% %type%"
    lore:
      - "&7Tugas: &f%objective%"
      - "&7Status: %state%"
      - ""
      - "&3Hadiah:"
      - "%rewards%"
  accept: {slot: 11, material: LIME_CONCRETE, name: "&aAmbil Quest", lore: ["&7Klik untuk mengambil quest ini."]}
  unavailable: {slot: 11, material: RED_CONCRETE, name: "&cTidak bisa diambil", lore: ["&7%state%"]}
  back: {slot: 15, material: ARROW, name: "&eKembali ke papan"}
