# ============================================================
# NereusRPG - RPG + Nerus Guild dalam satu plugin: class, level/stat/mana/skill,
# quest harian, misi cerita isekai, dan RPG Rank F sampai S.
# Warna memakai & (contoh &a hijau) dan hex &#RRGGBB. Setelah mengubah: /gm reload
# File lain: ranks.yml (rank), messages.yml (teks Guild), guild-dialogue.yml (dialog Caylin),
# quests.yml, missions.yml, classes.yml.
# ============================================================

timezone: "Asia/Jakarta"      # quest harian reset tengah malam zona ini

# ---------- Level, XP, stat ----------
level:
  max: 100
  # XP naik level = base + level*level*per-level-squared
  xp-base: 100
  xp-per-level-squared: 25
  stat-points-per-level: 3
  # XP dari membunuh mob = max health mob * kali ini (maksimal xp-kill-cap)
  xp-kill-multiplier: 0.5
  xp-kill-cap: 60
  # XP quest harian = base * (nomor rank + 1); tantangan x1.5
  xp-quest-base: 40

# 6 atribut: STR, DEF, VIT, AGI, INT, LUK. Semua punya batas (cap) agar tidak ada kombinasi overpower.
stats:
  str-melee-damage-percent: 0.8     # +0.8% damage jarak dekat per STR
  str-damage-cap-percent: 60        # batas bonus dari STR
  def-reduction-percent: 0.5        # -0.5% damage diterima per DEF (semua sumber damage kecuali void/lapar)
  def-reduction-cap-percent: 35
  vit-health-per-point: 1.0         # +1 HP (0.5 hati) per VIT
  vit-health-cap: 40                # maksimal +40 HP dari VIT (di dalam kode: dibatasi di applyBuffs)
  agi-speed-percent: 0.2            # +0.2% kecepatan jalan per AGI
  agi-speed-cap-percent: 20
  agi-crit-chance-percent: 0.3      # +0.3% peluang crit per AGI
  agi-crit-cap-percent: 15
  agi-bow-damage-percent: 0.5       # +0.5% damage panah per AGI
  agi-bow-cap-percent: 30
  int-mana-per-point: 5             # +5 mana maksimal per INT
  int-skill-power-percent: 2.0      # +2% kekuatan skill per INT
  luk-reward-chance-percent: 0.5    # peluang hadiah quest x1.5 per LUK
  luk-luck-per-point: 0.05          # atribut Luck Minecraft (loot, memancing) per LUK
  luk-luck-cap: 3.0

# Ras menggantikan Class. Bonus damage ras yang mengenai PEMAIN lain dikali pvp-scale (0.6 = 60%).
races:
  pvp-scale: 0.6
  # Class lama dipetakan ke ras saat pemain login. Data class asli tersimpan (legacy-class), tidak dihapus.
  class-migration:
    warrior: orc
    assassin: dark_elf
    archer: elf

# Kontrol skill (juga jalan di Bedrock HP): klik kanan = pakai skill terpilih
# (busur/crossbow/trident: klik kanan sambil jongkok), jongkok + klik kiri = ganti skill.
# Tombol F dan Shift+F serta /skill <nomor> tetap bisa.
controls:
  right-click-cast: true
  shift-left-click-cycle: true

# HUD action bar di atas hotbar. Placeholder: %hp% %maxhp% %mana% %maxmana% %level% %xp% %xpneed%
# %gp% %class% %rank% %skill% %cd% (cooldown skill terpilih) | ujian: %exam% %exam_progress% %exam_time%
# Matikan HUD ini dengan mana.actionbar: false (misal jika TAB / plugin lain yang tampilkan).
hud:
  # true = bar HP dan mana bergambar (ItemsAdder + konten itemsadder/nereus_ui). Pemain Bedrock
  # otomatis memakai teks di bawah ini.
  itemsadder: false
  format: "&cHP &f%hp% &8| &9Mana &f%mana%&7/&f%maxmana% &8| &6Lv &f%level% &8| &e%skill% &7%cd%"
  exam-format: "&6Ujian %exam% &8| &f%exam_progress% &8| &c%exam_time%"

# Menu bergambar lewat ItemsAdder (pasang folder itemsadder/nereus_ui lebih dulu, lalu /iazip).
# Bedrock otomatis memakai menu biasa. Jika gambar bergeser, setel offset di bawah.
gui:
  itemsadder-class-menu: false
  title-offset: 0
  texture-offset: 0

mana:
  base: 50
  per-level: 2
  regen-per-second: 2.0
  actionbar: true                   # tampilkan Lv / HP / mana / skill terpilih

# ---------- Intro isekai ----------
intro:
  enabled: true
  title: "&5&lMATI DI DUNIA LAMA"
  subtitle: "&7Lalu terbangun di dunia yang asing..."
  lines:
    - "&8&m                                        "
    - "&7Gelap. Dingin. Lalu cahaya menelanmu."
    - "&7Suara asing berbisik: &d\"Pahlawan dari dunia lain...\""
    - "&7Kamu terbangun di &fNereus&7, dunia yang sedang dirayapi kegelapan."
    - "&7Pilih jalanmu, &dPetualang&7. Guild menunggu."
    - "&8&m                                        "
  # Pemain wajib memilih class. Sebelum itu menu class dibuka terus.
  force-class-choice: true

# ---------- Class: ganti class ----------
class-change:
  allowed: true
  cooldown-hours: 24
  # Perintah konsol dijalankan saat ganti class (mis. biaya). Kosongkan jika gratis.
  # Jika perintah gagal (uang kurang) pemain tetap ganti, jadi isi hanya jika perlu.
  commands: []

# ---------- Quest ----------
# TIDAK ADA batas harian maupun batas jumlah quest aktif. Satu-satunya batas: cooldown PER ID quest.
# Daftar quest (13 kategori, tier F-S) ada di quests.yml.
quests:
  cooldown-hours: 5                 # quest yang sama baru bisa diambil lagi 5 jam setelah diambil (tetap jalan setelah restart)
  cooldown-hours-by-id: {}          # khusus ID tertentu, mis. { combat-1: 2 }
  reward-multiplier: 1.0            # pengali semua hadiah quest baru
  nr-command: "eco give %player% %amount%"   # perintah konsol pemberi Nerith
  count-creative: false             # progres quest dihitung saat Creative/Spectator
  # Hadiah dasar per tier x weight quest di quests.yml. exp = EXP, nr = Nerith, gp = Guild Point.
  tiers:
    F: {exp: 50, nr: 30, gp: 5}
    E: {exp: 110, nr: 60, gp: 10}
    D: {exp: 220, nr: 130, gp: 20}
    C: {exp: 420, nr: 280, gp: 35}
    B: {exp: 800, nr: 600, gp: 60}
    A: {exp: 1500, nr: 1300, gp: 100}
    S: {exp: 2800, nr: 3000, gp: 160}
  # Dipakai untuk quest lama (quests-legacy.yml) yang masih aktif di pemain.
  gp-multiplier: 0.5
  amount-multiplier: 2.0

# ---------- Login harian ----------
daily-login:
  enabled: true
  # hari ke-1, 2, 3 ... (hari ke-7 lalu mengulang). Perintah konsol.
  rewards:
    1: ["eco give %player% 30"]
    2: ["eco give %player% 40"]
    3: ["eco give %player% 50", "give %player% bread 8"]
    4: ["eco give %player% 60"]
    5: ["eco give %player% 80", "give %player% golden_apple 1"]
    6: ["eco give %player% 100"]
    7: ["eco give %player% 250", "give %player% diamond 2"]

# ---------- Pencapaian (jumlah quest selesai) ----------
milestones:
  quests-completed:
    10:
      name: "Pekerja Guild"
      commands: ["eco give %player% 200"]
    50:
      name: "Veteran Guild"
      commands: ["eco give %player% 1000", "give %player% diamond 5"]
    200:
      name: "Legenda Papan Quest"
      commands: ["eco give %player% 5000", "give %player% netherite_ingot 2"]
  kills:
    500:
      name: "Pemburu Monster"
      commands: ["eco give %player% 500"]
    5000:
      name: "Malapetaka Monster"
      commands: ["eco give %player% 5000"]

# ---------- Tampilan rank di atas kepala dan TAB ----------
# RPG Rank [F-S] terpisah dari rank server/donatur. Pemain belum terdaftar = NONE.
# Cara 1 (disarankan, TAB): pakai placeholder PlaceholderAPI
#   %nereusrpg_rank%        -> kode rank berwarna, mis. &6S (sudah berwarna)
#   %nereusrpg_rank_plain%  -> kode rank tanpa warna
#   %nereusrpg_class% %nereusrpg_level% %nereusrpg_gp% %nereusrpg_mana%
# Cara 2: meta LuckPerms lewat sync-commands (placeholder %luckperms_meta_adv_rank%).
# Cara 3: nametag bawaan plugin (matikan jika TAB yang mengatur nametag).
display:
  # Chat: [PREFIX DONATUR] Nama [RANK] » pesan. %luckperms_prefix% = rank donatur (butuh PlaceholderAPI + ekspansi LuckPerms).
  # Matikan jika plugin chat lain yang mengatur format.
  chat:
    enabled: true
    format: "%luckperms_prefix%&f%player% %rank%&8 » &f"
  # Nametag di atas kepala: [PREFIX DONATUR] Nama [RANK]. Matikan jika TAB yang mengatur nametag.
  builtin-nametag: true
  nametag-format: "%luckperms_prefix%"   # sebelum nama
  nametag-suffix: " &8[%rank%&8]"        # sesudah nama
  health-below-name: true                # angka darah ❤ di bawah nama
  tab-list-name: false                   # ubah nama di TAB juga

# Dijalankan konsol setiap rank diterapkan (naik rank, /rpg admin setrank, login).
# Placeholder: %player% %rank% (kode, mis. S atau NONE) %old_rank%
sync-commands:
  - "lp user %player% meta set adv_rank %rank%"

# Perintah konsol tambahan saat naik rank (sesudah ujian).
promote-commands: []

exam:
  cooldown-minutes: 60
  fail-on-death: true      # mati saat ujian = gagal

# Syarat dan hadiah rank F sampai S ada di ranks.yml (rank tertinggi = S).

menu-titles:
  hub: "&8Nerus Guild"
  quests: "&8Papan Quest"
  class: "&8Pilih Class"
  stats: "&8Stat Karakter"
  rank: "&8Nerus Guild - Rank"

# ============================================================
# NERUS GUILD
# ============================================================

# Format tanggal (registered_date, /gm info).
date-format: "dd MMM yyyy"

# NPC Guild Master "Caylin" dibuat di FancyNpcs (/npc create ...). Isi ID atau nama NPC-nya di sini.
npc:
  ids: ["caylin", "guildmaster"]
  click: ANY_CLICK            # RIGHT_CLICK | LEFT_CLICK | ANY_CLICK
  click-cooldown-ms: 1200
  max-distance: 8.0

# Tampilan dialog. Java: GUI (inventori, bawaan) | DIALOG (popup Paper) | CHAT (teks bernomor).
# Bedrock: form Floodgate jika Floodgate terpasang, jika tidak teks bernomor (/gm choose N).
dialogue:
  java-view: GUI
  button-width: 220           # hanya untuk java-view: DIALOG

# Perintah konsol yang dijalankan saat pemain berhasil mendaftar. Placeholder: %player%
registration:
  commands: []

# Warna rank untuk pemain Bedrock memakai warna cadangan (legacy) dari ranks.yml.
colors:
  bedrock-fallback: true

# Tampilan rank saat belum terdaftar (placeholder %nereusrpg_rank% = NONE).
ranks-display:
  none: "&7NONE"

# Alias /gm: true = NereusRPG mengambil alih /gm jika plugin lain (mis. Essentials: gamemode) sudah memakainya.
# Gamemode tetap bisa lewat /gamemode. false = /gm milik plugin lain dibiarkan, pakai /nereusrpg.
commands:
  take-over-gm: true

# Backup otomatis playerdata/ ke backups/ (zip). interval 0 = mati.
backup:
  interval-hours: 12
  keep: 14

# Migrasi otomatis dari plugin lama NereusRpg dan GuildMaster saat pertama kali jalan.
# legacy-players: pemain lama yang punya progres tetapi belum tercatat di GuildMaster:
#   REGISTER_IF_PROGRESS = otomatis REGISTERED (progres dipertahankan) | UNREGISTERED = harus daftar lewat Caylin
migration:
  auto: true
  legacy-players: REGISTER_IF_PROGRESS

# Peringkat Nerus Guild untuk placeholder %nereusrpg_top_N_name|rank|rank_plain|level|exp_total% dan %nereusrpg_top_pos%
# Urutan: rank tertinggi (S ... F) lalu EXP total. Hanya pemain REGISTERED.
top:
  size: 100
  refresh-seconds: 60
  empty-name: "-"
