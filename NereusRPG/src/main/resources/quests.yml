# ============================================================
# Quest NereusRPG: 13 kategori x 6 variasi = 78 quest. Tier F E D C B A S (S tertinggi).
# Hadiah (EXP, Nerith, Guild Points) dihitung dari tabel tier di config.yml (quests.tiers) x `weight` quest ini.
#   category : salah satu dari categories di bawah
#   tier     : F..S. Pemain rank X boleh mengambil quest tier X dan di bawahnya, plus satu tier di atasnya.
#   type     : KILL BREAK HARVEST PLANT PLACE CRAFT SMELT SMITH ENCHANT BREED TAME SHEAR MILK EAT SLEEP
#              SELL SELL_VALUE BUY_VALUE GET (diserahkan saat klaim) STAT (statistik Minecraft)
#   target   : daftar dipisah koma. Boleh wildcard: *_LOG (akhiran) atau NETHERITE_* (awalan).
#   cond     : opsional - BOW MELEE NIGHT NETHER END UNDERGROUND ADULT
#   amount   : jumlah. STAT: blok (jarak) / menit (TIME_SINCE_DEATH) / hitungan lain apa adanya.
#   weight   : pengali hadiah (0.8 mudah ... 1.5 sulit).
# Cooldown 5 jam berlaku per ID quest (config quests.cooldown-hours), bertahan setelah restart.
# ============================================================
