name: NereusRPG
version: '${project.version}'
main: com.nereus.rpg.NereusRPG
api-version: '1.21'
description: RPG dan Nerus Guild (Caylin) dalam satu plugin - ras, skill, quest, rank F-S
authors: [Nereus MC]
softdepend: [PlaceholderAPI, LuckPerms, TAB, Vault, ItemsAdder, FancyNpcs, floodgate, Geyser-Spigot, MythicMobs]
# Dimuat sebelum plugin yang bisa mengklaim /gm (alias gamemode).
loadbefore: [Essentials, EssentialsX]

commands:
  nereusrpg:
    description: Menu Nerus Guild dan perintah admin (alias /gm)
    usage: /nereusrpg [help|reload|info|data|register|revoke|restore|rank|backup|migrate|talk]
    aliases: [nerusrpg, gm, rpg, nereus]
  quest:
    description: Papan quest harian
    aliases: [quests, qb]
  story:
    description: Misi cerita
    usage: /story [serahkan]
    aliases: [misi, cerita]
  race:
    description: Pilih atau ganti ras
    aliases: [class, kelas, ras]
  stats:
    description: Stat karakter
    aliases: [stat]
  skill:
    description: Pakai skill
    usage: /skill [nomor]
    aliases: [skills]
  rank:
    description: RPG Rank Nerus Guild dan ujian
    usage: /rank [abandon]
    aliases: [guild, advrank]

permissions:
  nereusrpg.use:
    description: Memakai fitur RPG dan Nerus Guild
    default: true
  nereusrpg.admin:
    description: Semua perintah admin NereusRPG
    default: op
    children:
      nereusrpg.admin.reload: true
      nereusrpg.admin.info: true
      nereusrpg.admin.data: true
      nereusrpg.admin.register: true
      nereusrpg.admin.revoke: true
      nereusrpg.admin.restore: true
      nereusrpg.admin.rank: true
      nereusrpg.admin.backup: true
      nereusrpg.admin.migrate: true
      nereusrpg.admin.talk: true
  nereusrpg.admin.reload:
    description: /gm reload
    default: false
  nereusrpg.admin.info:
    description: /gm info
    default: false
  nereusrpg.admin.data:
    description: /gm data
    default: false
  nereusrpg.admin.register:
    description: /gm register
    default: false
  nereusrpg.admin.revoke:
    description: /gm revoke
    default: false
  nereusrpg.admin.restore:
    description: /gm restore
    default: false
  nereusrpg.admin.rank:
    description: /gm rank set|reset
    default: false
  nereusrpg.admin.backup:
    description: /gm backup
    default: false
  nereusrpg.admin.migrate:
    description: /gm migrate
    default: false
  nereusrpg.admin.talk:
    description: /gm talk (uji dialog)
    default: false
