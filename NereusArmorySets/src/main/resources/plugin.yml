name: NereusArmorySets
version: '${project.version}'
main: me.naook1.nereusarmorysets.NereusArmorySets
api-version: '1.21'
authors: [naook1, adityap]
description: Armor Armory (RPG Series) per tier - pertahanan nyata, set bonus atribut, model 3D, menu
commands:
  armoryset:
    description: Menu armor set (admin - give, list, info, reload)
    usage: /<command> [menu|give|list|info|reload]
    aliases: [aset, armorysets]
permissions:
  nereusarmorysets.use:
    description: Buka menu dan memakai set
    default: true
  nereusarmorysets.admin:
    description: Give, list, info, reload, dan ambil semua set dari menu
    default: op
  nereusarmorysets.take.*:
    description: Ambil semua set saat menu.free-take=false
    default: false
