# ArmorySets - set bonus atribut untuk armor Armory (RPG Series)
#
# Cara kerja: pakai 2 piece / 4 piece dari set yang sama -> bonus atribut aktif.
# Bonus 2 piece tetap aktif saat 4 piece (kumulatif).
# Nilai "amount" di bawah adalah nilai dasar (tier 1). Nilai akhir = amount x multiplier tier.
#
# operation:
#   add             -> tambah angka langsung (contoh: max_health 2.0 = 1 heart)
#   multiply_base   -> +% dari nilai dasar atribut
#   multiply_total  -> +% dari total atribut (termasuk senjata) - cocok untuk attack_damage / attack_speed
#
# attribute: max_health, armor, armor_toughness, attack_damage, attack_speed,
#            movement_speed, knockback_resistance, luck, safe_fall_distance, dll
#            (nama atribut vanilla tanpa prefix "generic.")

update-interval-ticks: 10     # seberapa sering bonus dicek ulang (20 tick = 1 detik)
actionbar-on-change: true     # tampilkan pesan di action bar saat bonus set berubah
custom-model-data-base: 0     # 0 = nonaktif. Jika > 0, tiap item diberi CustomModelData (untuk resource pack nanti)

tiers:
  1:
    name: "Lost"
    color: "&9"
    multiplier: 1.0
  2:
    name: "Forgotten"
    color: "&6"
    multiplier: 1.5
    # Tambah tier baru dengan menambah blok "3:" dst, lalu set "tier: 3" di set yang diinginkan.

sets:
