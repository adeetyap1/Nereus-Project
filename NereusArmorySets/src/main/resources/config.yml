# NereusArmorySets - armor Armory (RPG Series) dengan pertahanan nyata, set bonus atribut, model 3D, dan menu.
# Dipakai: /armoryset (buka menu).  Admin: /armoryset give|list|info|reload
#
# PERTAHANAN
#   Tiap piece membawa atribut armor / armor_toughness / knockback_resistance di item itu sendiri,
#   jadi perhitungan damage memakai sistem armor vanilla (bukan tiruan).
#   Nilai per piece = defense.classes.<class>.armor[slot] x tiers.<n>.armor-multiplier (dibulatkan 0.5).
#
# SET BONUS (2 / 4 piece) -> atribut tambahan, kumulatif. amount di bawah = nilai tier 1, dikali tiers.<n>.multiplier.
#   operation: add | multiply_base | multiply_total
#
# MODEL 3D (butuh resource pack di folder resourcepacks/ repo):
#   Java    : Nereus-ArmorySets-Java.zip  (+ ItemDisplay yang menempel di pemain, lihat display:)
#   Bedrock : Nereus-ArmorySets-Bedrock.mcpack + nereus_armorysets_geyser.json (taruh di plugins/Geyser-Spigot/custom_mappings/)

update-interval-ticks: 10
actionbar-on-change: true

# Nomor CustomModelData. Ikon item = base + setIndex*4 + slot ; model 3D (display) = base + 100 + yang sama.
# Jika diubah, jalankan ulang tools/build_pack.py supaya resource pack ikut berubah.
custom-model-data-base: 9000

menu:
  free-take: true        # true = semua pemain boleh ambil dari menu. false = hanya admin / punya permission take
  title: "&8Nereus Armory Sets"
  # permission saat free-take false: nereusarmorysets.take.tier<N> , nereusarmorysets.take.<set> , nereusarmorysets.admin

display:
  enabled: true          # model 3D di badan pemain Java (Bedrock memakai attachable dari resource pack)
  interval-ticks: 2
  offset-y: 0.0          # geser model naik/turun jika terlihat melayang/tenggelam
  scale: 1.0             # 1.0 = ukuran armor vanilla
  show-own: true         # tampilkan juga ke pemain itu sendiri (third person)
  view-range: 1.5

defense:
  # nilai dasar per slot: [head, chest, legs, feet]  (sama dengan material di mod Armory)
  durability-base: [11, 16, 15, 13]
  classes:
    robe:  { armor: [1, 3, 2, 1], toughness: 0.0, knockback: 0.0 }
    light: { armor: [2, 4, 4, 2], toughness: 0.0, knockback: 0.0 }
    heavy: { armor: [3, 8, 6, 3], toughness: 1.0, knockback: 0.0 }

tiers:
  1:
    name: "Lost"
    color: "&9"
    icon: IRON_CHESTPLATE
    multiplier: 1.0            # pengali set bonus
    armor-multiplier: 1.0      # pengali armor per piece
    toughness-bonus: 0.0       # tambahan toughness per piece
    durability-multiplier: 40  # durability = durability-base x ini
  2:
    name: "Forgotten"
    color: "&6"
    icon: NETHERITE_CHESTPLATE
    multiplier: 1.5
    armor-multiplier: 1.15
    toughness-bonus: 0.5
    durability-multiplier: 48
  # Tambah tier baru dengan blok "3:" dst lalu set "tier: 3" di set.

