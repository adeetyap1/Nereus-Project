# ============================================================
#  NereusFarmPrice  -  Daily Farm Boost
#  Developer : naook1/adityap
#  Server    : 1.21.1 (Paper) | Java 21 | Java + Bedrock (Geyser)
#  Butuh     : EconomyShopGUI (harga normal dibaca otomatis dari sana)
# ============================================================
# Cara kerja:
#  - Tiap periode (24 jam) plugin memilih TEPAT 3 farm berbeda dari daftar "candidates".
#  - Harga JUAL ketiga farm itu naik +50%. Farm lain tetap harga normal.
#  - Harga normal selalu dibaca dari file EconomyShopGUI (tidak ada harga ganda di plugin ini).
#  - Harga beli tidak pernah diubah. Tidak ada file EconomyShopGUI yang diubah.
#  - Daftar farm aktif + waktu mulai/akhir disimpan di data.yml, jadi aman saat server restart.

developer: "naook1/adityap"
small-caps: true            # teks di messages.yml jadi small caps
display: chat               # chat = panel teks di chat | book = buku yang bisa dibalik

boost:
  enabled: true
  percent: 50               # +50%  ->  harga buff = normal x (1 + 50/100)
  count: 3                  # jumlah farm yang di-boost
  duration-hours: 24        # lama satu periode
  timezone: "Asia/Makassar" # zona waktu untuk jadwal rotasi
  rotation-time: "00:00"    # jam ganti periode (tiap 24 jam dihitung dari jam ini, bukan dari jam server menyala)
  avoid-repeat: true        # hindari farm yang sama dengan periode sebelumnya (jika kandidat cukup)
  announce: true            # umumkan ke pemain online saat rotasi baru dimulai

integration:
  folders: ["EconomyShopGUI", "EconomyShopGUI-Premium"]   # folder plugin tempat file toko dibaca
  refresh-minutes: 10       # baca ulang harga dari file EconomyShopGUI
  notify-sale: true         # info bonus di action bar saat menjual farm boost
  # Dipakai hanya kalau EconomyShopGUI tidak mengizinkan harga diubah lewat event-nya:
  # selisih bonus dibayar lewat Vault setelah transaksi berhasil.
  fallback-vault-bonus: true

# Kandidat farm (nama material Minecraft). Tambah atau hapus sesuai kebutuhan.
# name: nama tampilan (kosong = otomatis dari material). icon: emoji di depan nama (kosong = tanpa).
# Item tanpa harga JUAL valid di EconomyShopGUI tidak akan pernah dipilih.
candidates:
  MELON_SLICE:
    icon: "🍉"
  MELON:
    icon: "🍈"
  CARROT:
    icon: "🥕"
  POTATO:
    icon: "🥔"
  PUMPKIN:
    icon: "🎃"
  CACTUS:
    icon: "🌵"
  BAMBOO:
    icon: "🎍"
  SUGAR_CANE:
    icon: "🌿"
  WHEAT:
    icon: "🌾"
  BEETROOT:
    icon: "🍠"
  NETHER_WART:
    icon: "🔴"
  COCOA_BEANS:
    icon: "🍫"
  KELP:
    icon: "🌊"
