# ============================================================
#  NereusFarmPrice
#  Developer : naook1/adityap
#  Server    : 1.21.1 (Paper) | Java 21 | Java + Bedrock (Geyser)
#  Butuh     : EconomyShopGUI (harga dasar dibaca otomatis dari sana)
# ============================================================
# Cara kerja:
#  - Harga dasar tiap farm = harga JUAL di EconomyShopGUI (ikut berubah kalau kamu edit shop).
#  - Tiap beberapa jam plugin memilih beberapa farm untuk di-BUFF (harga jual naik).
#  - Kalau satu jenis dijual terlalu banyak, harganya turun pelan-pelan (pasar jenuh) lalu pulih lagi.
#    Jadi pemain terdorong menanam banyak jenis, bukan cuma satu.
#  - Harga akhir dipakai langsung saat menjual lewat EconomyShopGUI (/shop, sell GUI, /sellall).

developer: "naook1/adityap"
small-caps: true
display: book            # book = menu buku (bersih, bisa di-scroll), chat = panel teks di chat

rotation:
  enabled: true
  interval-hours: 6      # buff diganti tiap sekian jam
  count: 2               # jumlah farm yang di-buff tiap rotasi
  min-multiplier: 1.4    # buff acak antara min dan maks
  max-multiplier: 2.0
  broadcast: true        # umumkan buff baru ke semua pemain

market:
  enabled: true
  capacity: 3000         # jumlah item terjual sampai harga mentok di batas bawah
  floor: 0.70            # harga terendah = 70% dari normal
  recovery-per-hour: 600 # tiap jam, sekian item "pulih" (harga naik lagi)

notify-sale: true        # tampilkan info buff di action bar saat menjual

esgui:
  folders: ["EconomyShopGUI", "EconomyShopGUI-Premium"]
  refresh-minutes: 10    # baca ulang harga dari file EconomyShopGUI

# Daftar farm. price: 0 = ikut EconomyShopGUI (isi angka untuk memaksa harga dasar tertentu).
# materials: semua item yang dihitung satu jenis (contoh melon = irisan + blok).
crops:
  wheat:
    name: "Gandum"
    materials: [WHEAT]
  carrot:
    name: "Wortel"
    materials: [CARROT]
  potato:
    name: "Kentang"
    materials: [POTATO]
  beetroot:
    name: "Bit"
    materials: [BEETROOT]
  melon:
    name: "Melon"
    materials: [MELON_SLICE, MELON]
  pumpkin:
    name: "Labu"
    materials: [PUMPKIN]
  sugar_cane:
    name: "Tebu"
    materials: [SUGAR_CANE]
  cocoa:
    name: "Kakao"
    materials: [COCOA_BEANS]
  nether_wart:
    name: "Nether Wart"
    materials: [NETHER_WART]
  sweet_berries:
    name: "Sweet Berry"
    materials: [SWEET_BERRIES]
  cactus:
    name: "Kaktus"
    materials: [CACTUS]
  bamboo:
    name: "Bambu"
    materials: [BAMBOO]
