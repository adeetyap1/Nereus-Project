# messages.yml - NereusFarmPrice - Developer: naook1/adityap
# Small caps otomatis jika small-caps: true. Placeholder tersedia di tiap bagian.
# Menu buku memakai warna gelap (&0 &8 &2) karena latarnya putih.

prefix: "&8[&6Farm&8] &7"

no-permission: "{prefix}&cKamu tidak punya izin untuk itu."
players-only: "{prefix}&cCommand ini hanya untuk player."
reloaded: "{prefix}&aConfig dimuat ulang. Harga EconomyShopGUI terbaca untuk &f{count} &aitem."
rotated: "{prefix}&aRotasi baru dipilih."
no-valid: "{prefix}&cTidak ada kandidat dengan harga jual valid di EconomyShopGUI. Cek &f/farmprice debug&c."
usage:
  - "&6/farmprice &8- &7Lihat farm yang sedang di-boost"
  - "&6/farmprice chat &8| &6book &8- &7Pilih tampilan"
  - "&6/farmprice rotate &8| &6reload &8| &6debug &7(admin)"

sale-note: "&6Daily Farm Boost &7{name} &8» &a+{delta} &8(&7+{percent}%&8)"

time:
  second: "detik"
  minute: "menit"
  hour: "jam"
  day: "hari"

# Pengumuman rotasi baru (dikirim ke pemain online, hanya sekali per rotasi)
announce:
  header:
    - "&6✦ Nereus MC | Daily Farm Boost"
    - "&8━━━━━━━━━━━━━━━━━━━━"
    - ""
    - "&eFarm Boost hari ini telah berganti!"
    - ""
  item: "&f{icon} {name_sc}"
  footer:
    - ""
    - "&6✦ Harga jual naik {percent}%!"
    - ""
    - "&7Farm lamamu tetap bisa digunakan."
    - "&7Manfaatkan bonus farm hari ini! &8(&f/farmprice&8)"

