bad-time: "{prefix}&cDurasi tidak valid. Contoh: 30m, 6h, 1d."
no-price: "{prefix}&cHarga dasar &f{crop} &cbelum terbaca dari EconomyShopGUI. Pakai &fx1.5 &c(kelipatan) atau isi 'price' di config."
