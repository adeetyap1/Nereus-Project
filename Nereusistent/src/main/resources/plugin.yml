name: Nereusistent
version: '${project.version}'
main: me.naook1.nereusistent.Nereusistent
api-version: '1.21'
authors: [naook1, adityap]
description: Hotbar gadget menu (RTP, survival, gacha, info, rules). Developer naook1/adityap
softdepend: [PlaceholderAPI, LuckPerms, BetterRTP, Multiverse-Core, CrazyCrates, Essentials, EssentialsSpawn, PlayerKits2, DeluxeMenus, NereusThrone]

commands:
  nereusistent:
    description: Gadget Nereusistent
    aliases: [nsi, gadget]
    usage: /<command> [give [player]|reload|about]

permissions:
  nereusistent.use:
    description: Dapat gadget di hotbar dan bisa membuka menunya
    default: true
  nereusistent.admin:
    description: Reload dan give gadget
    default: op
