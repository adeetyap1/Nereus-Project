file-version: 2
# menus.yml - Menu gadget Nereusistent - Developer: naook1/adityap
#
# Item: slot/slots, material, name, lore, amount, glow, custom-model-data, actions
# Actions:
#   [menu] <id>          buka menu lain         [close]             tutup menu
#   [player] <command>   jalankan sbg player    [console] <command> jalankan sbg console
#   [message] <teks>     kirim pesan            [sound] <key>       mainkan sound
#   [link] <url>         kirim link yang bisa diklik
#
# Command default sesuai plugin di servermu. Ubah kalau berbeda:
#   RTP      -> BetterRTP        : rtp
#   Survival -> Multiverse-Core  : mvtp survival   (ganti "survival" dengan nama world)
#   Gacha    -> CrazyCrates      : crates
#   Spawn    -> EssentialsSpawn  : spawn
#   Kits     -> PlayerKits2      : kit
#   Nereus   -> NereusRealm     : nereus (menu), nereus ranks, nereus feedback, nereus afk

filler:
  material: BLACK_STAINED_GLASS_PANE
  name: " "

menus:
  main:
    title: "&8Nereusistent"
    rows: 6
    items:
      header:
        slot: 4
        material: NETHER_STAR
        name: "&6{server_name}"
        lore:
          - "&7Selamat datang, &f{player}&7!"
          - "&7Online: &a{online}&7/&f{max}"
          - ""
          - "&8Developer: &7{developer}"
      # --- Baris 1: teleport
      rtp:
        slot: 19
        material: ENDER_PEARL
        name: "&bRTP"
        lore:
          - "&7Teleport acak ke lokasi baru."
          - ""
          - "&eKlik untuk teleport"
        actions:
          - "[close]"
          - "[player] rtp"
      survival:
        slot: 21
        material: GRASS_BLOCK
        name: "&aSurvival"
        lore:
          - "&7Masuk ke dunia survival."
          - ""
          - "&eKlik untuk masuk"
        actions:
          - "[close]"
          - "[player] mvtp survival"
      gacha:
        slot: 23
        material: ENDER_CHEST
        name: "&dGacha"
        lore:
          - "&7Buka crate dan dapatkan hadiah."
          - ""
          - "&eKlik untuk membuka"
        actions:
          - "[close]"
          - "[player] crates"
      spawn:
        slot: 25
        material: RED_BED
        name: "&fSpawn"
        lore:
          - "&7Kembali ke spawn."
          - ""
          - "&eKlik untuk ke spawn"
        actions:
          - "[close]"
          - "[player] spawn"
      # --- Baris 2: informasi
      info:
        slot: 28
        material: BOOK
        name: "&eInfo Server"
        lore:
          - "&7Informasi dan link server."
          - ""
          - "&eKlik untuk membuka"
        actions:
          - "[menu] info"
      rules:
        slot: 30
        material: WRITABLE_BOOK
        name: "&cRules"
        lore:
          - "&7Aturan yang wajib dipatuhi."
          - ""
          - "&eKlik untuk membuka"
        actions:
          - "[menu] rules"
      ranks:
        slot: 32
        material: DIAMOND
        name: "&bDaftar Rank"
        lore:
          - "&7Lihat rank, fitur, dan harga."
          - ""
          - "&eKlik untuk membuka"
        actions:
          - "[close]"
          - "[player] nereus ranks"
      feedback:
        slot: 34
        material: GOLD_NUGGET
        name: "&6Rating Server"
        lore:
          - "&7Beri bintang dan masukan,"
          - "&7baca masukan pemain lain."
          - ""
          - "&eKlik untuk membuka"
        actions:
          - "[close]"
          - "[player] nereus feedback"
      # --- Baris 3: fitur pemain
      afk:
        slot: 37
        material: RED_BED
        name: "&bAFK Center"
        lore:
          - "&7Reward AFK, timer, dan pengaturan."
          - ""
          - "&eKlik untuk membuka"
        actions:
          - "[close]"
          - "[player] nereus afk"
      kits:
        slot: 39
        material: CHEST
        name: "&6Kits"
        lore:
          - "&7Ambil kit kamu."
          - ""
          - "&eKlik untuk membuka"
        actions:
          - "[close]"
          - "[player] kit"
      nereus:
        slot: 41
        material: COMPASS
        name: "&aNereus Menu"
        lore:
          - "&7Join/leave message, daily, settings."
          - ""
          - "&eKlik untuk membuka"
        actions:
          - "[close]"
          - "[player] nereus"
      about:
        slot: 43
        material: NAME_TAG
        name: "&6About Developer"
        lore:
          - "&7Siapa di balik Nereusistent."
          - ""
          - "&eKlik untuk membuka"
        actions:
          - "[menu] about"
      # --- Bawah
      gadget:
        slot: 46
        material: LEVER
        name: "&fGadget Hotbar"
        lore:
          - "&7Item Nereusistent di hotbar."
          - "&7Status: {gadget_state}"
          - ""
          - "&eKlik untuk hidupkan/matikan"
        actions:
          - "[toggle-gadget]"
      close:
        slot: 49
        material: BARRIER
        name: "&cTutup"
        actions:
          - "[close]"

  info:
    title: "&8Info Server"
    rows: 4
    items:
      server:
        slot: 11
        material: NETHER_STAR
        name: "&6{server_name}"
        lore:
          - "&7Versi: &fJava & Bedrock 1.21.1"
          - "&7Online: &a{online}&7/&f{max}"
          - "&7Mode: &fSurvival"
      discord:
        slot: 13
        material: PAPER
        name: "&9Discord"
        lore:
          - "&7Gabung komunitas kami."
          - ""
          - "&eKlik untuk mendapatkan link"
        actions:
          - "[close]"
          - "[link] https://discord.gg/your-link"
      website:
        slot: 15
        material: MAP
        name: "&bWebsite / Store"
        lore:
          - "&eKlik untuk mendapatkan link"
        actions:
          - "[close]"
          - "[link] https://example.com"
      back:
        slot: 31
        material: ARROW
        name: "&cKembali"
        actions:
          - "[menu] main"

  rules:
    title: "&8Rules"
    rows: 4
    items:
      rules:
        slot: 13
        material: WRITTEN_BOOK
        name: "&cRules Server"
        lore:
          - "&71. &fHormati semua player dan staff."
          - "&72. &fDilarang cheat, hack, dan x-ray."
          - "&73. &fDilarang bug abuse / dupe."
          - "&74. &fDilarang spam, flood, dan iklan."
          - "&75. &fDilarang griefing di area orang lain."
          - "&76. &fKeputusan staff bersifat final."
      back:
        slot: 31
        material: ARROW
        name: "&cKembali"
        actions:
          - "[menu] main"

  about:
    title: "&8About Developer"
    rows: 3
    items:
      developer:
        slot: 11
        material: NAME_TAG
        name: "&6Developer"
        lore:
          - "&f{developer}"
          - ""
          - "&7Pembuat plugin custom"
          - "&7{server_name}."
      plugin:
        slot: 13
        material: NETHER_STAR
        name: "&eNereusistent &7v{version}"
        lore:
          - "&7Gadget menu RTP, Survival, Gacha,"
          - "&7Info Server, dan Rules."
      thanks:
        slot: 15
        material: HEART_OF_THE_SEA
        name: "&dTerima Kasih"
        lore:
          - "&7Terima kasih sudah bermain di"
          - "&6{server_name}&7!"
      back:
        slot: 22
        material: ARROW
        name: "&cKembali"
        actions:
          - "[menu] main"
