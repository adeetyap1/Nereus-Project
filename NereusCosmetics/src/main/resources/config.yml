# NereusCosmetics - cosmetic untuk Java dan Bedrock (digambar dengan partikel dari server, tanpa resource pack)
# Rank: tiap cosmetic punya "permission". Kasih permission itu lewat LuckPerms ke rank yang boleh pakai, contoh:
#   /lp group vip permission set nereuscosmetics.use.halo_gold true
#   /lp group admin permission set nereuscosmetics.all true     (semua cosmetic)
# Kosongkan permission ("") kalau cosmetic itu boleh dipakai semua orang.
# Admin (nereuscosmetics.admin) otomatis bisa ambil semua lewat /cosmetics (GUI) dan /cosmetics give <player> <id|all>.

settings:
  interval: 3            # tick antar frame (3 = 6.7x per detik). Besar = lebih hemat, kecil = lebih halus
  view-distance: 24      # jarak pemain lain bisa lihat partikel
  show-self: true        # pemakai ikut melihat cosmetic sendiri

menu:
  title: "&8Cosmetics"

messages:
  prefix: "&b[Cosmetics] &r"
  locked: "&cRank kamu belum boleh pakai cosmetic ini."
  equipped: "&aDipasang: &r"
  removed: "&eCosmetic dilepas."
  unknown: "&cCosmetic tidak ditemukan."
  noperm: "&cKamu tidak punya izin."
  offline: "&cPemain tidak online."
  done: "&aSelesai."
  reloaded: "&aConfig dimuat ulang, cosmetic: "
  list: "&fDaftar: &7"

