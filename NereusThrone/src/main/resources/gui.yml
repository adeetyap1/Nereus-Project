# gui.yml - Menu /nereus - Developer: naook1/adityap
#
# Teks otomatis small caps (small-caps.gui di config.yml).
# Item: slot/slots, material, name, lore, amount, glow, head (kepala player), custom-model-data,
#       actions (klik kiri / tap), right-actions (klik kanan)
#
# Actions:
#   [menu] <id>          buka menu lain          [close]            tutup menu
#   [player] <command>   jalankan sbg player     [console] <command> jalankan sbg console
#   [message] <teks>     kirim pesan             [sound] <key>      mainkan sound
#   [daily]              claim daily             [afk]              toggle AFK
#   [toggle] <flag>      show-joinleave | show-afk | show-rewards
#   [refresh]            buka ulang menu ini
#
# Placeholder item: {player} {developer} {join_style} {leave_style} {streak} {daily_status} {reset}
#   {afk_state} {afk_interval} {afk_money_base} {afk_money_step} {afk_money_max} {afk_key_chance}
#   {kits_command} {state_show_joinleave} {state_show_afk} {state_show_rewards} + PlaceholderAPI

click-sound: "ui.button.click"
click-volume: 0.6

filler:
  material: BLACK_STAINED_GLASS_PANE
  name: " "

style-item:
  name: "{style_name}"
  locked-material: BARRIER
  lore-unlocked:
    - "&7Preview:"
    - "{preview}"
    - ""
    - "&eKlik kiri &7untuk memilih"
    - "&eKlik kanan &7untuk preview"
  lore-selected:
    - "&7Preview:"
    - "{preview}"
    - ""
    - "&a✔ Sedang dipakai"
  lore-locked:
    - "&7Preview:"
    - "{preview}"
    - ""
    - "&c✘ Terkunci"
    - "&7Dibutuhkan: &f{requirement}"

daily-item:
  material-claimed: LIME_STAINED_GLASS_PANE
  name-available: "&e{reward_name}"
  name-claimed: "&a✔ {reward_name}"
  name-locked: "&7{reward_name}"
  lore-available:
    - "{reward_lore}"
    - ""
    - "&aKlik untuk claim!"
  lore-claimed:
    - "{reward_lore}"
    - ""
    - "&7Sudah di-claim"
  lore-locked:
    - "{reward_lore}"
    - ""
    - "&8Belum tersedia"

menus:
  main:
    title: "&8Nereus Throne"
    rows: 5
    items:
      profile:
        slot: 4
        material: PLAYER_HEAD
        head: true
        name: "&6{player}"
        lore:
          - "&7Rank: &f%luckperms_prefix%"
          - ""
          - "&7Join style: {join_style}"
          - "&7Leave style: {leave_style}"
          - "&7Daily streak: &e{streak}"
          - ""
          - "&8Developer: &7{developer}"
      join:
        slot: 20
        material: LIME_DYE
        name: "&aJoin Message"
        lore:
          - "&7Atur pesan saat kamu masuk."
          - "&7Sekarang: {join_style}"
          - ""
          - "&eKlik untuk membuka"
        actions:
          - "[menu] join-styles"
      leave:
        slot: 22
        material: RED_DYE
        name: "&cLeave Message"
        lore:
          - "&7Atur pesan saat kamu keluar."
          - "&7Sekarang: {leave_style}"
          - ""
          - "&eKlik untuk membuka"
        actions:
          - "[menu] leave-styles"
      daily:
        slot: 24
        material: CLOCK
        name: "&eDaily Reward"
        lore:
          - "&7Claim hadiah tiap hari."
          - "&7Status: {daily_status}"
          - "&7Streak: &e{streak}"
          - ""
          - "&eKlik untuk membuka"
        actions:
          - "[menu] daily"
      kits:
        slot: 29
        material: CHEST
        name: "&6Kits"
        lore:
          - "&7Ambil kit kamu."
          - ""
          - "&eKlik untuk membuka"
        actions:
          - "[close]"
          - "[player] {kits_command}"
      afk:
        slot: 31
        material: RED_BED
        name: "&bAFK"
        lore:
          - "&7Status: {afk_state}"
          - ""
          - "&7Reward AFK tiap &e{afk_interval} menit&7:"
          - "&8» &a${afk_money_base} &7(naik +${afk_money_step}, maks ${afk_money_max})"
          - "&8» &7Peluang key acak: &e{afk_key_chance}%"
          - ""
          - "&eKlik untuk toggle AFK"
        actions:
          - "[afk]"
      settings:
        slot: 33
        material: COMPARATOR
        name: "&dSettings"
        lore:
          - "&7Pengaturan pribadi."
          - ""
          - "&eKlik untuk membuka"
        actions:
          - "[menu] settings"
      servermenus:
        slot: 40
        material: NETHER_STAR
        name: "&6Menu Lainnya"
        lore:
          - "&7Battle Royale, Kaiser Profile,"
          - "&7Chronicle, Decree, Rules."
          - ""
          - "&eKlik untuk membuka"
        actions:
          - "[menu] server-menus"
      close:
        slot: 44
        material: BARRIER
        name: "&cTutup"
        actions:
          - "[close]"

  join-styles:
    title: "&8Join Message"
    rows: 5
    type: join-styles
    dynamic-slots: [10, 11, 12, 13, 14, 15, 16, 19, 20, 21, 22, 23, 24, 25]
    items:
      info:
        slot: 4
        material: LIME_DYE
        name: "&aJoin Message"
        lore:
          - "&7Sekarang: {join_style}"
      back:
        slot: 40
        material: ARROW
        name: "&cKembali"
        actions:
          - "[menu] main"

  leave-styles:
    title: "&8Leave Message"
    rows: 5
    type: leave-styles
    dynamic-slots: [10, 11, 12, 13, 14, 15, 16, 19, 20, 21, 22, 23, 24, 25]
    items:
      info:
        slot: 4
        material: RED_DYE
        name: "&cLeave Message"
        lore:
          - "&7Sekarang: {leave_style}"
      back:
        slot: 40
        material: ARROW
        name: "&cKembali"
        actions:
          - "[menu] main"

  daily:
    title: "&8Daily Reward"
    rows: 4
    type: daily
    dynamic-slots: [10, 11, 12, 13, 14, 15, 16]
    items:
      info:
        slot: 4
        material: CLOCK
        name: "&eDaily Reward"
        lore:
          - "&7Status: {daily_status}"
          - "&7Streak: &e{streak}"
          - "&7Reset dalam: &f{reset}"
      claim:
        slot: 22
        material: EMERALD
        name: "&aClaim Sekarang"
        actions:
          - "[daily]"
      back:
        slot: 31
        material: ARROW
        name: "&cKembali"
        actions:
          - "[menu] main"

  settings:
    title: "&8Settings"
    rows: 3
    items:
      joinleave:
        slot: 11
        material: PAPER
        name: "&fPesan join/leave"
        lore:
          - "&7Tampilkan pesan join/leave player lain."
          - "&7Status: {state_show_joinleave}"
          - ""
          - "&eKlik untuk toggle"
        actions:
          - "[toggle] show-joinleave"
      afk:
        slot: 13
        material: RED_BED
        name: "&fPesan AFK"
        lore:
          - "&7Tampilkan pesan AFK player lain."
          - "&7Status: {state_show_afk}"
          - ""
          - "&eKlik untuk toggle"
        actions:
          - "[toggle] show-afk"
      rewards:
        slot: 15
        material: GOLD_NUGGET
        name: "&fNotifikasi reward AFK"
        lore:
          - "&7Pesan saat dapat reward AFK."
          - "&7Status: {state_show_rewards}"
          - ""
          - "&eKlik untuk toggle"
        actions:
          - "[toggle] show-rewards"
      back:
        slot: 22
        material: ARROW
        name: "&cKembali"
        actions:
          - "[menu] main"

  # Menu DeluxeMenus yang sudah ada. Ganti id setelah "dm open" sesuai nama file menu kamu.
  server-menus:
    title: "&8Menu Lainnya"
    rows: 4
    items:
      main:
        slot: 10
        material: COMPASS
        name: "&6Main Menu"
        actions:
          - "[player] dm open main_menu"
      battle:
        slot: 11
        material: IRON_SWORD
        name: "&cBattle Royale"
        actions:
          - "[player] dm open battle_royale_menu"
      profile:
        slot: 12
        material: PLAYER_HEAD
        head: true
        name: "&bKaiser Profile"
        actions:
          - "[player] dm open kaiser_profile_menu"
      chronicle:
        slot: 14
        material: WRITTEN_BOOK
        name: "&eKaiser Chronicle"
        actions:
          - "[player] dm open kaiser_chronicle_menu"
      decree:
        slot: 15
        material: MAP
        name: "&dImperial Decree"
        actions:
          - "[player] dm open imperial_decree_menu"
      rules:
        slot: 16
        material: BOOK
        name: "&aRules"
        actions:
          - "[player] dm open rules_menu"
      back:
        slot: 31
        material: ARROW
        name: "&cKembali"
        actions:
          - "[menu] main"
