# ============================================================
# NereusPets - konfigurasi
# Warna memakai kode & (contoh &a hijau, &6 emas).
# Ubah angka, lalu jalankan /pets reload.
# ============================================================

# Ukuran pet di dunia. 0.5 = setengah ukuran asli (bisa diganti per jenis dengan "scale").
pet-scale: 0.5

# Maksimal pet yang boleh disimpan satu pemain.
box-limit: 90

# Panggil lagi pet terakhir yang aktif saat pemain masuk server.
auto-summon: true

# Pet otomatis menyerang monster di sekitar pemain.
auto-engage: true
engage-range: 8
# Monster yang tidak diserang otomatis (supaya tidak memancing amarah mereka).
engage-blacklist: [ENDERMAN, ZOMBIFIED_PIGLIN, WARDEN, PIGLIN_BRUTE, ENDER_DRAGON, WITHER, ELDER_GUARDIAN]

# Jarak serang jarak dekat (blok) dan jeda antar serangan (milidetik).
melee-reach: 1.8
attack-interval-ms: 1000

# Perilaku mengikuti pemain.
follow-distance: 4.0
teleport-distance: 20.0
follow-speed: 1.3

# Pet pingsan saat HP habis. Pemain tidak kehilangan pet-nya.
faint-seconds: 60
# Pemulihan HP pet yang disimpan di box, persen HP maksimal per detik.
regen-percent-per-second: 1.0

# Level pet liar saat ditangkap: 1 sampai angka ini.
wild-level-max: 5

# Kecepatan pet terkontrol (blok per 2 tick). Dipakai Warden, Naga, Wither, Ghast, dll.
controlled-speed: 0.5

capture:
  min-chance: 0.03
  max-chance: 0.95
  # Mob vanilla biasa hanya bisa ditangkap sampai kelangkaan ini. Di atasnya hanya dari pet liar atau gacha.
  vanilla-max-rarity: RARE
  # Batas peluang per kelangkaan. Legendaris sengaja sangat kecil.
  limits:
    EPIC:
      min: 0.02
      max: 0.60
    LEGENDARY:
      min: 0.005
      max: 0.30
  # Tambahan peluang saat HP mob rendah. 1.0 = HP hampir habis memberi hingga +100%.
  low-hp-bonus: 1.0
  show-chance: true

xp:
  # XP yang didapat pet = HP maksimal monster x angka ini.
  per-health: 1.0
  # XP untuk naik dari level L: base + growth x L x L
  base: 20
  growth: 5
  max-level: 50

disabled-worlds: []

menu-title: "&8Pet Box"

# Pet Orb dilempar seperti bola salju. Multiplier mengalikan peluang tangkap.
orbs:
  basic:
    name: "&bPet Orb"
    multiplier: 1.0
    lore:
      - "&7Lempar ke mob untuk menangkapnya."
      - "&7Lebih mudah kalau HP mob rendah."
  great:
    name: "&aGreat Orb"
    multiplier: 1.6
    lore:
      - "&7Lempar ke mob untuk menangkapnya."
      - "&7Peluang tangkap lebih besar."
  ultra:
    name: "&6Ultra Orb"
    multiplier: 2.5
    lore:
      - "&7Lempar ke mob untuk menangkapnya."
      - "&7Peluang tangkap sangat besar."
  master:
    name: "&d&lMaster Orb"
    multiplier: 4.0
    lore:
      - "&7Orb terkuat. Cocok untuk pet Legendaris."
      - "&8Tetap tidak ada jaminan."

# Pet liar tersebar di map. Mereka tidak menyerang, tidak bisa dibunuh (HP mentok 1),
# dan hilang sendiri setelah expire-seconds. Lempar Pet Orb untuk menangkapnya.
wild:
  enabled: true
  interval-seconds: 60       # tiap berapa detik dicek untuk tiap pemain
  chance: 0.10               # peluang muncul per pemain per pengecekan
  max-alive: 24
  max-near-player: 2         # maksimal pet liar dalam near-radius dari pemain
  near-radius: 64
  min-distance: 24
  max-distance: 64
  expire-seconds: 600
  # Bobot kelangkaan untuk spawn biasa. Legendaris 0 karena lewat event tiap 10 menit.
  rarity-weights:
    COMMON: 60
    UNCOMMON: 28
    RARE: 9
    EPIC: 3
    LEGENDARY: 0
  # Level pet liar (rentang).
  levels:
    COMMON: "1-8"
    UNCOMMON: "3-12"
    RARE: "8-20"
    EPIC: "15-30"
    LEGENDARY: "25-45"

# Event: satu pet Legendaris liar muncul tiap interval (hanya satu hidup sekaligus).
legendary:
  enabled: true
  interval-seconds: 600
  expire-seconds: 480
  min-distance: 60
  max-distance: 120
  announce: true
  # Koordinat di pengumuman dibulatkan ke kelipatan ini supaya tidak terlalu mudah.
  announce-precision: 50

# Duel pet lawan pet pemain lain. Pet tidak pingsan dan dipulihkan setelah duel.
duel:
  enabled: true
  max-distance: 30
  request-seconds: 30
  countdown-seconds: 3
  max-seconds: 120
  cooldown-seconds: 10
  # XP untuk pemenang = base + per-level x level pet yang kalah.
  xp-base: 40
  xp-per-level: 6

# Gabung 2 pet sejenis: pet kedua hilang, pet pertama dapat 1 bintang (tambahan stat).
fuse:
  max-stars: 5
  bonus-per-star: 0.08
  min-fodder-level: 10

# Telur gacha. Pakai di crate: /pets give egg %player% normal 1  atau  /pets give hatch %player% rare
# weights = peluang kelangkaan hasil tetas (angka relatif).
eggs:
  normal:
    name: "&fTelur Pet"
    material: TURTLE_EGG
    level: 1
    glow: false
    lore:
      - "&7Klik kanan untuk menetaskan pet acak."
    weights: {COMMON: 62, UNCOMMON: 25, RARE: 10, EPIC: 2.7, LEGENDARY: 0.3}
  rare:
    name: "&9Telur Pet Langka"
    material: SNIFFER_EGG
    level: 5
    glow: true
    lore:
      - "&7Klik kanan untuk menetaskan pet acak."
      - "&7Peluang pet Epik dan Legendaris lebih besar."
    weights: {UNCOMMON: 40, RARE: 40, EPIC: 17, LEGENDARY: 3}
  legend:
    name: "&6&lTelur Naga Nereus"
    material: DRAGON_EGG
    level: 10
    glow: true
    lore:
      - "&7Dijamin Epik atau lebih."
      - "&6Ada peluang pet Legendaris."
    weights: {EPIC: 85, LEGENDARY: 15}

# Permen XP untuk pet aktif. levels: 1 = naik tepat 1 level.
candies:
  small:
    name: "&aPermen XP Kecil"
    material: SUGAR
    xp: 100
    lore: ["&7Klik kanan: +100 XP untuk pet aktif."]
  medium:
    name: "&9Permen XP Sedang"
    material: HONEYCOMB
    xp: 600
    glow: true
    lore: ["&7Klik kanan: +600 XP untuk pet aktif."]
  rare:
    name: "&6&lRare Candy"
    material: GLOW_BERRIES
    levels: 1
    glow: true
    lore: ["&7Klik kanan: pet aktif naik 1 level."]

# Jenis pet. Nama harus sama dengan EntityType Minecraft.
