# controlled : true = AI mob dimatikan dan digerakkan plugin (mob terbang / berbasis brain)
# flying     : true = melayang (hanya bersama controlled)
# habitat    : OVERWORLD, NETHER, END, ANY (tempat pet liar muncul)
# wild-scale : ukuran saat jadi pet liar (di tangan pemain pakai scale)
# wild-weight: bobot muncul di antara jenis sekelas (default 1)
# egg        : boleh keluar dari telur gacha (default true)
# aura       : partikel di pet liar (FLAME, SOUL_FIRE_FLAME, END_ROD, WITCH, PORTAL, ELECTRIC_SPARK, SOUL, CLOUD)
