name: NereusPets
version: '${project.version}'
main: com.nereus.pets.NereusPets
api-version: '1.21'
description: Pet mini ala Pokemon dengan mob vanilla untuk Nereus MC
authors: [Nereus MC]

commands:
  pets:
    description: Buka Pet Box dan kelola pet
    usage: /pets [recall|rename|info|release|duel|fuse|legend|give|wild|reload]
    aliases: [pet]
    permission: nereuspets.use

permissions:
  nereuspets.use:
    description: Memakai pet dan Pet Orb
    default: true
  nereuspets.admin:
    description: Memberi orb dan pet, reload config
    default: op
