name: Build
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            m2-
            setup-java-
      - name: Build plugins
        run: |
          set -o pipefail
          mkdir out
          for dir in NereusRealm NereusLottery NereusFarmPrice NereusBarter NereusLand NereusHide NereusFishing NereusSize NereusBank NereusEvents NereusArmory NereusCosmetics; do
            ok=0
            for try in 1 2 3; do
              if mvn -B -f "$dir/pom.xml" clean package 2>&1 | tee "$dir-build.log"; then ok=1; break; fi
              echo "Build of $dir failed (try $try), retrying in 15s"; sleep 15
            done
            if [ "$ok" != 1 ]; then
              # show compile errors as annotations so they are visible on the run page
              grep -E '^\[ERROR\]' "$dir-build.log" | head -40 | while read -r line; do echo "::error::$dir: $line"; done
              exit 1
            fi
            cp "$dir"/target/*.jar out/
          done
      - uses: actions/upload-artifact@v4
        with:
          name: plugins
          path: out/*.jar
      - name: Publish release (jars and packs as direct downloads)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest out/*.jar resourcepacks/* --title "Latest plugins" --notes "Jar plugin dan pack terbaru (otomatis dari commit ${GITHUB_SHA::7}). Unduh file .jar langsung, tidak perlu unzip." --target "$GITHUB_SHA"
