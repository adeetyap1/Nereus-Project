name: Build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build plugins
        run: |
          mkdir out
          for dir in NereusThrone Nereusistent; do
            mvn -B -f "$dir/pom.xml" clean package
            cp "$dir"/target/*.jar out/
          done
      - uses: actions/upload-artifact@v4
        with:
          name: plugins
          path: out/*.jar
