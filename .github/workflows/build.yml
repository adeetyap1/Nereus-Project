name: Build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build plugins
        run: |
          set -o pipefail
          mkdir out
          for dir in NereusRealm Nereusistent; do
            if ! mvn -B -f "$dir/pom.xml" clean package 2>&1 | tee "$dir-build.log"; then
              # show compile errors as annotations so they are visible on the run page
              grep -E '^\[ERROR\] .*(\.java|symbol|location)' "$dir-build.log" | head -40 | while read -r line; do echo "::error::$line"; done
              exit 1
            fi
            cp "$dir"/target/*.jar out/
          done
      - uses: actions/upload-artifact@v4
        with:
          name: plugins
          path: out/*.jar
