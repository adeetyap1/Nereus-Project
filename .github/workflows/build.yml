name: Build
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build plugins
        run: |
          set -o pipefail
          mkdir out
          for dir in NereusRealm NereusLottery NereusFarmPrice NereusBarter NereusLand NereusHide NereusFishing NereusSize NereusBank; do
            if ! mvn -B -f "$dir/pom.xml" clean package 2>&1 | tee "$dir-build.log"; then
              # show compile errors as annotations so they are visible on the run page
              grep -E '^\[ERROR\] .*(\.java|symbol|location)' "$dir-build.log" | head -40 | while read -r line; do echo "::error::$line"; done
              exit 1
            fi
            cp "$dir"/target/*.jar out/
          done
      - uses: actions/upload-artifact@v4
        with:
          name: plugins
          path: out/*.jar
      - name: Publish release (jars and packs as direct downloads)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest out/*.jar resourcepacks/* --title "Latest plugins" --notes "Jar plugin dan pack terbaru (otomatis dari commit ${GITHUB_SHA::7}). Unduh file .jar langsung, tidak perlu unzip." --target "$GITHUB_SHA"
