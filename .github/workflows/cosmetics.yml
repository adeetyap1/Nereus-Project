name: Cosmetics
on:
  push:
    paths:
      - 'NereusCosmetics/**'
      - '.github/workflows/cosmetics.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build NereusCosmetics
        run: |
          set -o pipefail
          ok=0
          for try in 1 2 3; do
            if mvn -B -f NereusCosmetics/pom.xml clean package 2>&1 | tee build.log; then ok=1; break; fi
            sleep 15
          done
          if [ "$ok" != 1 ]; then
            grep -E '^\[ERROR\]' build.log | head -40 | while read -r line; do echo "::error::$line"; done
            exit 1
          fi
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete cosmetics --cleanup-tag --yes || true
          gh release create cosmetics NereusCosmetics/target/*.jar --title "NereusCosmetics" --notes "NereusCosmetics jar (commit ${GITHUB_SHA::7})" --target "$GITHUB_SHA"
