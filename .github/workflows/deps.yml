name: Deps
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: mvn -B -f NereusCosmetics/pom.xml dependency:copy-dependencies -DoutputDirectory=/tmp/deps
      - uses: actions/upload-artifact@v4
        with:
          name: paper-deps
          path: /tmp/deps
