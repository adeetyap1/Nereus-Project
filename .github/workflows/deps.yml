name: Deps
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: mvn -B -f NereusCosmetics/pom.xml dependency:copy-dependencies -DoutputDirectory=/tmp/deps
      - name: Publish deps zip to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd /tmp/deps && zip -q -r /tmp/deps.zip . 
          gh release view deps -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create deps --title deps --notes deps --target "$GITHUB_SHA" -R "$GITHUB_REPOSITORY"
          gh release upload deps /tmp/deps.zip --clobber -R "$GITHUB_REPOSITORY"
