# ============================================================================
#  NereusIntro - Cinematic Isekai Reincarnation System
#  Semua teks memakai format MiniMessage (https://docs.advntr.dev/minimessage/format.html)
#  Placeholder yang tersedia di teks cerita:  <player>  (nama pemain)
# ============================================================================
config-version: 1

# Matikan untuk menonaktifkan intro bagi pemain biasa (admin tetap bisa /intro test).
enabled: true

prefix: "<dark_gray>[<aqua>Intro</aqua>]</dark_gray> "

# ----------------------------------------------------------------------------
# Mulai otomatis saat login
# ----------------------------------------------------------------------------
auto-start:
  enabled: true
  delay-ticks: 60             # jeda setelah login sebelum intro dimulai (20 tick = 1 detik)
  # true  = hanya pemain yang BARU PERTAMA KALI masuk server (aman untuk server yang sudah berjalan)
  # false = semua pemain yang belum pernah menyelesaikan intro (pemain lama juga akan dapat intro)
  new-players-only: true

replay:
  # Pemain biasa boleh menjalankan /intro lagi setelah selesai? (admin selalu bisa)
  allow-players: false

# ----------------------------------------------------------------------------
# Skip
# ----------------------------------------------------------------------------
skip:
  enabled: true
  allow-players: true         # pemain biasa boleh /intro skip
  min-seconds-before-skip: 5  # tidak bisa skip di beberapa detik pertama (mencegah skip tidak sengaja)
  require-confirm: true       # ketik /intro skip dua kali
  confirm-window-seconds: 10

# ----------------------------------------------------------------------------
# Admin / testing
# ----------------------------------------------------------------------------
admin:
  allow-test: true
  test-works-when-disabled: true   # /intro test tetap jalan walau enabled: false
  unlimited-replay: true           # /intro biasa untuk admin tidak dibatasi
  debug-in-test: true              # tampilkan nomor langkah di action bar saat test
  allow-commands-in-test: true     # admin boleh memakai command lain saat test

# ----------------------------------------------------------------------------
# LOKASI  (WAJIB DIISI sebelum intro bisa berjalan)
# Cara termudah: berdiri di tempat yang diinginkan lalu ketik:
#     /intro setpos room      -> ruang putih (tempat pemain berdiri, hadap ke Nerith)
#     /intro setpos spawn     -> spawn akhir Nereus
# Jika world kosong, intro TIDAK akan berjalan dan pemain TIDAK diteleport ke mana pun.
# ----------------------------------------------------------------------------
locations:
  # Ruang putih. Contoh isian:  world: "nereus_intro"  x: 0.5  y: 100.0  z: 0.5  yaw: 180.0  pitch: 0.0
  # (yaw 0 = menghadap selatan, 90 = barat, 180 = utara, -90 = timur)
  room:
    world: ""
    x: 0.5
    y: 100.0
    z: 0.5
    yaw: 180.0
    pitch: 0.0
  # Spawn akhir. Pilih salah satu:
  #  (a) use-world-spawn-of: "world"   -> memakai spawn bawaan world tsb (/setworldspawn)
  #  (b) kosongkan use-world-spawn-of lalu isi world/x/y/z di bawah
  spawn:
    use-world-spawn-of: ""
    world: ""
    x: 0.5
    y: 64.0
    z: 0.5
    yaw: 0.0
    pitch: 0.0
  # Hanya dipakai bila npc.position.mode = absolute
  nerith:
    world: ""
    x: 0.5
    y: 100.0
    z: -2.5
    yaw: 0.0
    pitch: 0.0

# ----------------------------------------------------------------------------
# NPC NERITH (FancyNpcs)
# NPC dibuat per-pemain (packet), tidak disimpan ke file FancyNpcs, dan hanya terlihat
# oleh pemain yang sedang menjalani intro. Dihapus otomatis saat intro selesai.
# ----------------------------------------------------------------------------
npc:
  enabled: true
  display-name: "<white><bold>NERITH</bold></white>"
  scale: 1.0
  # NPC terus menghadap pemain (tick). 0 = hanya menghadap saat muncul dan saat langkah "npc: look".
  keep-facing-interval-ticks: 20
  # continue = intro lanjut tanpa NPC (dialog tetap tampil di chat); abort = intro dibatalkan
  on-failure: continue
  position:
    mode: relative         # relative = di depan pemain; absolute = pakai locations.nerith
    forward: 3.0           # jarak di depan pemain (blok)
    side: 0.0              # geser kanan (+) / kiri (-)
    y-offset: 0.0
  # Skin. mode: default | username | uuid | url | file | texture
  #  default  -> skin bawaan klien (Steve/Alex) + pakaian putih (white-outfit di bawah)
  #  username -> nama akun Minecraft Java yang punya skin putih
  #  url      -> link langsung ke file PNG skin 64x64
  #  texture  -> isi value dan signature dari mineskin.org (paling stabil, tanpa fetch saat runtime)
  skin:
    mode: default
    value: ""
    signature: ""
    variant: AUTO          # AUTO | SLIM
  # Pakaian serba putih: armor kulit yang diwarnai. Kosongkan material untuk slot yang tidak dipakai.
  white-outfit:
    enabled: true
    color: "#FFFFFF"
    head: LEATHER_HELMET
    chest: LEATHER_CHESTPLATE
    legs: LEATHER_LEGGINGS
    feet: LEATHER_BOOTS

# ----------------------------------------------------------------------------
# Pengaturan cinematic
# ----------------------------------------------------------------------------
cinematic:
  lock-player: true              # pemain tidak bisa bergerak/berinteraksi selama intro
  game-mode: ADVENTURE           # mode permainan selama intro (dikembalikan setelahnya)
  isolate-from-others: true      # sembunyikan pemain intro dari pemain lain (dan sebaliknya)
  fade:
    enabled: true                # fade hitam memakai efek Blindness (jalan di Java dan Bedrock)
  sounds: true
  # Musik latar (suara custom dari resource pack, lihat README). Tanpa resource pack = hening, tidak error.
  music:
    enabled: true
    category: RECORD         # RECORD | MUSIC | MASTER | AMBIENT ... (kategori slider volume pemain)
  # Efek halus saat dialog supaya tidak sepi: bunyi lembut + sedikit partikel cahaya di sekitar Nerith.
  dialogue-effects:
    enabled: true
    say-sound: "minecraft:block.amethyst_block.chime"
    say-bedrock-sound: ""      # kosong = sama dengan say-sound
    say-volume: 0.25
    pitch-min: 1.4
    pitch-max: 1.9
    particles: true
    particles-on-bedrock: true # matikan bila partikel bermasalah di Bedrock
    player-sound: "minecraft:block.note_block.hat"   # bunyi kecil saat ucapan pemain; kosong = mati
    player-volume: 0.2
  max-duration-minutes: 15       # pengaman: sesi yang menggantung dihentikan otomatis
  teleport-timeout-ticks: 200
  min-step-delay-ticks: 1
  # Jeda otomatis untuk baris narasi/dialog yang tidak punya "wait":
  #   jeda = base + jumlah_huruf * per-char, dibatasi min..max (tick)
  pause:
    base-ticks: 30
    per-char-ticks: 0.9
    min-ticks: 45
    max-ticks: 180
  format:
    dialogue: "<white><bold>NERITH</bold></white> <dark_gray>»</dark_gray> <white><text>"
    player: "<yellow><player></yellow> <dark_gray>»</dark_gray> <gray><text>"
    narration: "<gray><italic><text></italic>"
    actionbar: "<gray><text>"

# ----------------------------------------------------------------------------
# Resource pack musik (khusus pemain Java). Plugin mengirim pack ini sendiri saat intro dimulai
# dan menunggu sampai termuat, jadi server.properties TIDAK perlu diubah.
# Pemain Bedrock memakai .mcpack di plugins/Geyser-Spigot/packs/.
# ----------------------------------------------------------------------------
resource-pack:
  enabled: true
  url: "https://raw.githubusercontent.com/adeetyap1/Nereus-Project/main/resourcepacks/Nereus-Intro-Java.zip"
  sha1: "e448b9618ab8c973ad5bbc84fc624320ef2f8c7a"
  prompt: "<gray>Musik dan suara intro Nereus"
  force: false             # true = pemain yang menolak pack ditendang oleh klien
  wait-seconds: 15         # batas menunggu pack termuat; lewat itu intro jalan tanpa musik

# ----------------------------------------------------------------------------
# Bedrock (Geyser + Floodgate)
# ----------------------------------------------------------------------------
bedrock:
  spawn-npc: true           # false = pemain Bedrock tidak melihat NPC (dialog tetap tampil lewat chat)
  use-fallback-sounds: true # pakai "bedrock-sound" pada langkah sound untuk pemain Bedrock

# ----------------------------------------------------------------------------
# Recovery
# ----------------------------------------------------------------------------
recovery:
  enabled: true                # simpan kondisi pemain ke plugins/NereusIntro/recovery/<uuid>.yml selama intro
  restore-on-join: true
  restart-interrupted: true    # intro yang terputus (disconnect/crash) dimulai lagi saat login
  max-restarts: 2              # batas pengulangan otomatis agar tidak terjadi loop
  restart-delay-ticks: 60

# Selama intro, command lain diblokir kecuali yang ada di daftar ini.
protection:
  block-commands: true
  allowed-commands: [intro, nereusintro, nintro]

# ----------------------------------------------------------------------------
# Pesan sistem
# ----------------------------------------------------------------------------
messages:
  no-permission: "<red>Kamu tidak punya izin untuk itu."
  player-only: "<red>Command ini hanya untuk pemain. Dari konsol gunakan: /intro test <nama>"
  player-not-found: "<red>Pemain tidak ditemukan."
  disabled: "<yellow>Intro sedang dinonaktifkan."
  already-active: "<yellow>Intro sedang berjalan."
  already-completed: "<yellow>Kamu sudah menyelesaikan intro."
  not-active: "<yellow>Tidak ada intro yang sedang berjalan."
  not-configured: "<red>Intro belum bisa dijalankan. Lokasi belum diatur: <problems>"
  not-configured-admin-hint: "<gray>Atur dengan /intro setpos room dan /intro setpos spawn, lalu /intro reload."
  npc-unavailable: "<red>FancyNpcs tidak tersedia. Intro tidak dapat dijalankan."
  empty-timeline: "<red>Timeline cerita kosong atau tidak valid. Periksa config.yml."
  recovery-pending: "<yellow>Kondisimu sedang dipulihkan. Coba lagi sebentar lagi."
  dead: "<yellow>Intro tidak bisa dimulai saat kamu mati."
  test-started: "<gold>[TEST] <gray>Mode test dimulai. Progresmu tidak berubah. Ketik /intro skip untuk berhenti."
  test-ended: "<gold>[TEST] <gray>Test selesai. Kondisimu sudah dipulihkan."
  skipped: "<gray>Intro dilewati."
  skip-disabled: "<yellow>Skip dinonaktifkan."
  skip-too-early: "<yellow>Tunggu sebentar sebelum melewati intro."
  skip-confirm: "<yellow>Ketik <white>/intro skip</white> sekali lagi untuk melewati intro."
  failed: "<red>Intro dihentikan karena terjadi kesalahan. Kondisimu sudah dipulihkan."
  timed-out: "<red>Intro dihentikan karena melewati batas waktu."
  recovered: "<gray>Kondisimu dipulihkan setelah intro yang terputus."
  command-blocked: "<red>Command tidak bisa dipakai selama intro. Ketik /intro skip untuk melewati."
  reloaded: "<green>Config dimuat ulang. Sesi yang sedang berjalan tidak terganggu."
  reset-done: "<green>Progres intro <player> direset."
  location-saved: "<green>Lokasi <name> disimpan: <where>"
  location-invalid: "<red>Gunakan: /intro setpos <room|spawn|nerith>"
  conflict-hint: "<gray>/intro dipakai plugin lain. Gunakan /nereusintro."

# ----------------------------------------------------------------------------
# TIMELINE CERITA
# Langkah dijalankan berurutan, satu per satu. Setiap langkah punya "type" dan opsional "wait"
# (jeda dalam tick SETELAH langkah itu sebelum langkah berikutnya).
#
#   narrate  : text                         narasi di chat (jeda otomatis sesuai panjang teks)
#   say      : text                         dialog Nerith di chat
#   player   : text                         ucapan pemain sendiri di chat
#   title    : title, subtitle, fade-in, stay, fade-out
#   actionbar: text
#   sound    : sound, volume, pitch, bedrock-sound, duration, interval   (wait default 0)
#              duration (tick) > 0 = suara diulang tiap `interval` tick selama `duration`, lalu dihentikan
#              (untuk hujan, klakson, dengung). Hentikan lebih awal: type sound, action stop, sound <key sama>
#   music    : action (start | stop), sound, bedrock-sound, length (detik, untuk mengulang lagu), volume
#   fade     : mode (out = gelap, in = terang), ticks
#   teleport : target (room | spawn)
#   npc      : action (spawn | look | remove)
#   wait     : ticks
# ----------------------------------------------------------------------------
timeline:
  # ---- A. Kehidupan lama

  - type: "fade"
    mode: "out"
    ticks: 20

  - type: "teleport"
    target: "room"
    wait: 10

  - type: "sound"
    sound: "minecraft:weather.rain"
    bedrock-sound: "minecraft:weather.rain"
    volume: 0.6
    pitch: 1.0
    duration: 1200
    interval: 50

  - type: "title"
    title: "<white>23.47"
    subtitle: "<gray>Hujan belum juga berhenti"
    fade-in: 5
    stay: 25
    fade-out: 10
    wait: 35

  - type: "narrate"
    text: "Hujan turun deras. Kamu berjalan menyeberangi jalan sambil menatap ponsel."

  - type: "narrate"
    text: "Ada satu pesan yang belum sempat kamu balas."

  - type: "sound"
    sound: "minecraft:item.goat_horn.sound.0"
    bedrock-sound: "minecraft:block.note_block.bass"
    volume: 0.5
    pitch: 0.7
    duration: 80
    interval: 40

  - type: "narrate"
    text: "Suara klakson. Cahaya menyilaukan. Semuanya terjadi begitu cepat."

  - type: "narrate"
    text: "Ada banyak hal yang belum sempat kamu lakukan. Banyak orang yang belum sempat kamu temui lagi."

  - type: "narrate"
    text: "Tapi sekarang, semuanya sudah terlambat."
    wait: 20

  - type: "sound"
    action: "stop"
    sound: "minecraft:weather.rain"
    bedrock-sound: "minecraft:weather.rain"

  - type: "sound"
    action: "stop"
    sound: "minecraft:item.goat_horn.sound.0"
    bedrock-sound: "minecraft:block.note_block.bass"

  # ---- B. Ruang putih

  - type: "fade"
    mode: "in"
    ticks: 20

  - type: "sound"
    sound: "minecraft:block.amethyst_block.chime"
    bedrock-sound: "minecraft:block.amethyst_block.chime"
    volume: 0.7
    pitch: 1.2

  - type: "music"
    action: "start"
    sound: "nereusintro:music.whiteroom"
    bedrock-sound: "nereusintro:music.whiteroom"
    length: 60.5
    volume: 0.7

  - type: "sound"
    sound: "minecraft:block.beacon.ambient"
    bedrock-sound: "minecraft:block.beacon.ambient"
    volume: 0.25
    pitch: 1.0
    duration: 6000
    interval: 80

  - type: "narrate"
    text: "Saat membuka mata, kamu tidak lagi berada di jalanan. Hanya ada hamparan putih tanpa ujung."

  - type: "npc"
    action: "spawn"
    wait: 20

  - type: "narrate"
    text: "Sebuah entitas berwarna putih berdiri di hadapanmu. Entah sejak kapan ia berada di sana."

  # ---- C. Percakapan dengan Nerith

  - type: "say"
    text: "Akhirnya bangun juga."

  - type: "player"
    text: "Ini di mana? Kamu siapa?"

  - type: "say"
    text: "Tempat antara hidup dan mati. Dan ya, kamu sudah mati."

  - type: "player"
    text: "Tunggu... jadi aku benar-benar mati?"

  - type: "say"
    text: "Iya. Mau kuucapkan selamat datang di alam baka?"

  - type: "player"
    text: "Lalu sekarang bagaimana?"

  - type: "say"
    text: "Aku bisa memberimu kesempatan hidup kedua. Di dunia bernama Nereus."

  - type: "player"
    text: "Dunia lain? Jangan-jangan aku harus jadi pahlawan?"

  - type: "say"
    text: "Pfft. Bro pikir dirinya MC?"

  - type: "player"
    text: "Jadi, aku tidak dapat kekuatan khusus atau semacamnya?"

  - type: "say"
    text: "Baru juga hidup lagi, sudah banyak maunya."

  - type: "player"
    text: "Setidaknya kasih sedikit kemudahan."

  - type: "say"
    text: "Hahaha. Selamat datang di Nereus. Semoga kali ini hidupmu tidak berakhir terlalu cepat."

  # ---- D. Reinkarnasi

  - type: "sound"
    sound: "minecraft:block.beacon.activate"
    bedrock-sound: "minecraft:block.beacon.activate"
    volume: 0.8
    pitch: 1.0

  - type: "music"
    action: "stop"

  - type: "sound"
    action: "stop"
    sound: "minecraft:block.beacon.ambient"
    bedrock-sound: "minecraft:block.beacon.ambient"

  - type: "fade"
    mode: "out"
    ticks: 30

  - type: "npc"
    action: "remove"

  - type: "teleport"
    target: "spawn"
    wait: 20

  - type: "sound"
    sound: "minecraft:block.amethyst_block.resonate"
    bedrock-sound: "minecraft:block.amethyst_block.chime"
    volume: 0.6
    pitch: 1.0

  - type: "music"
    action: "start"
    sound: "nereusintro:music.nereus"
    bedrock-sound: "nereusintro:music.nereus"
    length: 60.5
    volume: 0.7

  - type: "narrate"
    text: "Angin menyentuh wajahmu. Suara orang-orang terdengar dari kejauhan. Sebuah dunia baru terbentang di hadapanmu."

  - type: "fade"
    mode: "in"
    ticks: 30

  - type: "title"
    title: "<aqua><bold>NEREUS"
    subtitle: "<gray>Kehidupan keduamu dimulai"
    fade-in: 10
    stay: 35
    fade-out: 15
    wait: 100

