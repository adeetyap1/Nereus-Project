file-version: 4
# Icon rank custom (pack Java + pack Bedrock). Developer: naook1/adityap
# Di prefix LuckPerms / chat tulis :owner: dst, atau :rank: (otomatis sesuai group).
# Satu karakter per rank = lencana. Tulisan rank (labels) dipasang sebagai teks biasa di sebelahnya, sama di Java dan Bedrock.
# Karakter icon jangan diubah kecuali kamu mengganti pack.

icons:
  owner: "\uE000"
  admin: "\uE008"
  staff: "\uE010"
  emperor: "\uE018"
  king: "\uE020"
  duke: "\uE028"
  viscount: "\uE030"
  baron: "\uE038"
  knight: "\uE040"
  rakyat: "\uE048"

# Urutan pengecekan group untuk :rank: dan %nereusicons_rank% (permission "group.<nama>" dari LuckPerms).
# Group paling atas yang dimiliki pemain yang dipakai. Isi nama group -> id icon.
groups:
  owner: owner
  admin: admin
  staff: staff
  emperor: emperor
  king: king
  duke: duke
  viscount: viscount
  baron: baron
  knight: knight
  default: rakyat


# Warna nama pemain per group (kode warna & atau &#rrggbb). Dipasang di belakang icon lewat /nereus icon apply.
# Icon sendiri tetap putih (warna asli gambar), karena warna baru dipasang setelah icon.
name-colors:
  owner: "&6"
  admin: "&c"
  staff: "&b"
  emperor: "&5"
  king: "&e"
  duke: "&d"
  viscount: "&9"
  baron: "&a"
  knight: "&3"
  default: "&7"

# Tulisan rank yang dipasang setelah lencana (teks biasa berwarna + tebal, memakai warna dari name-colors).
labels:
  owner: "OWNER"
  admin: "ADMIN"
  staff: "STAFF"
  emperor: "EMPEROR"
  king: "KING"
  duke: "DUKE"
  viscount: "VISCOUNT"
  baron: "BARON"
  knight: "KNIGHT"
  default: "RAKYAT"
