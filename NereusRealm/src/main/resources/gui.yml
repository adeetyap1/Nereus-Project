    border: BLACK_STAINED_GLASS_PANE
    dynamic-slots: [10, 11, 12, 13, 14, 15, 16, 19, 20, 21, 22, 23, 24, 25]
    items:
      info:
        slot: 4
        material: RED_DYE
        name: "&cLeave Message"
        lore:
