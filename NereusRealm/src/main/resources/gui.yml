        name: "&eInfo & Rules"
        lore:
          - "&7Info server, link, dan aturan."
          - ""
          - "&eKlik untuk membuka"
        actions:
          - "[menu] info"
      close:
        slot: 49
        material: BARRIER
        name: "&cTutup"
