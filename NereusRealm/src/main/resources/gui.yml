  # ---------------------------------------------------------------- daily
  daily:
    title: "&8Daily Reward"
    rows: 5
    type: daily
    border: BLACK_STAINED_GLASS_PANE
    refresh: true
    dynamic-slots: [19, 20, 21, 22, 23, 24, 25]
