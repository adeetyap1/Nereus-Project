          - "&8Developer: &7{developer}"
      discord:
        slot: 12
        material: PAPER
        name: "&9Discord"
        lore:
          - "&7Gabung komunitas kami."
          - ""
          - "&eKlik untuk mendapatkan link"
        actions:
          - "[close]"
          - "[link] https://discord.gg/your-link"
      website:
        slot: 14
        material: MAP
        name: "&bWebsite / Store"
        lore:
          - "&eKlik untuk mendapatkan link"
