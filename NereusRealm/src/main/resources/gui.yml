        slot: 4
        material: PLAYER_HEAD
        head: true
        name: "&6{player}"
        lore:
          - "&7Rank: &f{current_rank}"
          - "&7Online: &a{online}&7/&f{max}"
          - ""
          - "&7Join style: {join_style}"
          - "&7Leave style: {leave_style}"
          - "&7Daily streak: &e{streak}"
          - "&7Rating server: &e{rating_avg}&7/5"
          - ""
          - "&8Developer: &7{developer}"
      # --- Baris 1: teleport
      rtp:
        slot: 19
        material: ENDER_PEARL
        name: "&bRTP"
        lore:
          - "&7Teleport acak ke lokasi baru."
          - ""
          - "&eKlik untuk teleport"
        actions:
          - "[close]"
          - "[player] rtp"
      survival:
        slot: 21
        material: GRASS_BLOCK
        name: "&aSurvival"
        lore:
          - "&7Masuk ke dunia survival."
          - ""
          - "&eKlik untuk masuk"
        actions:
          - "[close]"
          - "[player] mvtp survival"
      gacha:
        slot: 23
        material: ENDER_CHEST
        name: "&dGacha"
        lore:
          - "&7Buka crate dan dapatkan hadiah."
          - ""
          - "&eKlik untuk teleport"
        actions:
          - "[teleport] gacha"
      spawn:
        slot: 25
        material: RED_BED
        name: "&fSpawn"
        lore:
          - "&7Kembali ke spawn."
          - ""
          - "&eKlik untuk ke spawn"
        actions:
          - "[close]"
          - "[player] spawn"
      # --- Baris 2: hadiah & fitur harian
      daily:
        slot: 28
        material: CLOCK
        name: "&eDaily Reward"
        lore:
          - "&7Claim hadiah tiap hari."
          - "&7Status: {daily_status}"
          - "&7Streak: &e{streak}"
          - ""
          - "&eKlik untuk membuka"
        actions:
          - "[menu] daily"
      kits:
        slot: 30
        material: CHEST
        name: "&6Kits"
        lore:
          - "&7Ambil kit kamu."
          - ""
          - "&eKlik untuk membuka"
        actions:
          - "[close]"
          - "[player] {kits_command}"
      afk:
        slot: 32
        material: RED_BED
        name: "&bAFK Center"
        lore:
          - "&7Status: {afk_state}"
          - "&7Reward tiap &e{afk_interval} menit &7saat AFK."
          - ""
          - "&eKlik untuk membuka"
        actions:
          - "[menu] afk"
      redeem:
        slot: 34
        material: TRIPWIRE_HOOK
        name: "&dRedeem Code"
        lore:
          - "&7Punya kode hadiah?"
          - "&7Tukarkan di sini."
          - ""
          - "&eKlik lalu ketik kodenya"
        actions:
          - "[redeem]"
      # --- Baris 3: tampilan & komunitas
      join:
        slot: 37
        material: LIME_DYE
        name: "&aJoin Message"
        lore:
          - "&7Atur pesan saat kamu masuk."
          - "&7Sekarang: {join_style}"
          - ""
          - "&eKlik untuk membuka"
        actions:
          - "[menu] join-styles"
      leave:
        slot: 39
        material: RED_DYE
        name: "&cLeave Message"
        lore:
          - "&7Atur pesan saat kamu keluar."
          - "&7Sekarang: {leave_style}"
          - ""
          - "&eKlik untuk membuka"
        actions:
          - "[menu] leave-styles"
      ranks:
        slot: 41
        material: DIAMOND
        name: "&bDaftar Rank"
        lore:
          - "&7Lihat rank, fitur, dan harga."
          - "&7Rank kamu: &f{current_rank}"
          - ""
          - "&eKlik untuk membuka"
        actions:
          - "[menu] ranks"
      feedback:
        slot: 43
        material: NETHER_STAR
        name: "&6Rating Server"
        lore:
          - "&7Beri bintang dan masukan."
          - "&7Nilai server: {rating_stars} &f{rating_avg}"
          - ""
          - "&eKlik untuk membuka"
        actions:
