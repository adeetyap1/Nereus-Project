file-version: 4
# gui.yml - Menu /nereus - Developer: naook1/adityap
#
# Teks otomatis small caps (small-caps.gui di config.yml).
#
# Menu : title, rows (1-6), border (item bingkai), filler, refresh (update tiap detik), type, dynamic-slots
# Item : slot/slots, material, name, lore, amount, glow, glow-if, head, custom-model-data,
#        show-if (tampil hanya jika syarat terpenuhi), actions (klik kiri), right-actions (klik kanan)
#
# Syarat show-if / glow-if (awali ! untuk kebalikan):
#   afk | has-review | custom | admin | has-prev | has-next | stars-1 .. stars-5
#
# Actions:
#   [menu] <id>            buka menu            [close]                 tutup menu
#   [player] <command>     jalankan sbg player  [console] <command>     jalankan sbg console
#   [message] <teks>       kirim pesan          [sound] <key>           mainkan sound
#   [link] <url>           kirim link klik      [page] next|prev        ganti halaman
#   [daily]                claim daily          [afk]                   toggle AFK
#   [afk-reason]           mulai AFK + tanya alasan di chat
#   [toggle] <flag>        show-joinleave | show-afk | show-rewards
#   [custom-set|custom-use|custom-reset] join|leave
#   [feedback-start]       mulai beri rating    [rate] 1-5              pilih bintang
#   [feedback-delete]      hapus rating sendiri
#   [redeem]               minta kode redeem di chat
#   [teleport] <titik>     teleport ke titik yang diatur admin: /nereus setpoint <titik>
#   [toggle-gadget]        hidupkan/matikan item gadget di hotbar
#
# Placeholder item: {player} {developer} {version} {server_name} {current_rank}
#   {join_style} {leave_style} {streak} {daily_status} {reset}
#   {afk_state} {afk_time} {afk_reason} {afk_next_in} {afk_next_money} {afk_progress} {afk_progress_pct}
#   {afk_reward_state} {afk_session_money} {afk_session_keys} {afk_interval} {afk_auto}
#   {afk_money_base} {afk_money_step} {afk_money_max} {afk_key_chance}
#   {custom_join_text} {custom_leave_text} {custom_join_active} {custom_leave_active}
#   {custom_max} {custom_colors} {custom_requirement}
#   {rating_avg} {rating_count} {rating_stars} {my_stars} {feedback_next}
#   {online} {max} {gadget_state} {state_show_joinleave} {state_show_afk} {state_show_rewards} {kits_command} {page} {pages}
#   + PlaceholderAPI. Satu baris lore yang isinya persis {afk_ladder}, {afk_keys}, {rating_dist},
#   {my_feedback} akan diganti beberapa baris.

click-sound: "ui.button.click"
click-volume: 0.6

filler:
  material: GRAY_STAINED_GLASS_PANE
  name: " "

lists:
  afk-ladder-count: 5
  afk-ladder-line: "&8» &7Siklus {cycle} &8(&f{minutes}m&8) &8» &a${amount}"
  afk-money-off: "&8» &7Reward uang dimatikan"
  afk-key-line: "&8» {key} &8» &e{share}% &8(&7{overall}% per siklus&8)"
  afk-key-off: "&8» &7Reward key dimatikan"
  feedback-wrap: 34

style-item:
  name: "{style_name}"
  locked-material: BARRIER
  lore-unlocked:
    - "&7Preview:"
    - "{preview}"
    - ""
    - "&eKlik kiri &7untuk memilih"
    - "&eKlik kanan &7untuk preview"
  lore-selected:
    - "&7Preview:"
    - "{preview}"
    - ""
    - "&a✔ Sedang dipakai"
  lore-locked:
    - "&7Preview:"
    - "{preview}"
    - ""
    - "&c✘ Terkunci"
    - "&7Dibutuhkan: &f{requirement}"

daily-item:
  material-claimed: LIME_STAINED_GLASS_PANE
  name-available: "&e{reward_name}"
  name-claimed: "&a✔ {reward_name}"
  name-locked: "&7{reward_name}"
  lore-available:
    - "{reward_lore}"
    - ""
    - "&aKlik untuk claim!"
  lore-claimed:
    - "{reward_lore}"
    - ""
    - "&7Sudah di-claim"
  lore-locked:
    - "{reward_lore}"
    - ""
    - "&8Belum tersedia"

feedback-item:
  name: "&e{review_name}"
  lore:
    - "{review_stars} &8(&f{review_rating}&8)"
    - ""
    - "{review_message}"
    - ""
    - "&8{review_ago}"

rank-item:
  name: "{rank_name}"
  lore:
    - "&7Harga: &e{rank_price}"
    - "&7Durasi: &f{rank_duration}"
    - ""
    - "&6Fitur:"
    - "{rank_features}"
    - ""
    - "{rank_status}"

menus:
  # ---------------------------------------------------------------- utama
  main:
    title: "&8Nereus Realm"
    rows: 6
    border: BLACK_STAINED_GLASS_PANE
    items:
