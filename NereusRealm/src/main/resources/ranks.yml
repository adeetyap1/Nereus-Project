file-version: 1
# ranks.yml - Daftar rank untuk menu /nereus ranks - Developer: naook1/adityap
#
# SEMUA ISI DI BAWAH HANYA CONTOH. Ubah nama, harga, dan fitur sesuai servermu.
#
# id       : nama group LuckPerms (dipakai untuk menandai "Rank kamu saat ini")
# name     : nama tampilan
# icon     : item di menu (cocokkan dengan tingkatan rank)
# price    : teks bebas (mis. "Rp 25.000" atau "$10")
# duration : teks bebas (mis. "Permanen" atau "30 hari")
# features : satu baris per fitur
# actions  : yang terjadi saat rank diklik. Default = kirim link store.
#            [link] <url>  [player] <cmd>  [console] <cmd>  [message] <teks>  [menu] <id>
#
# Urutan menu = urutan di file ini (maksimal 6 rank).

store-url: "https://example.com/store"

default-actions:
  - "[close]"
  - "[link] {store_url}"

