name: NereusRealm
version: '${project.version}'
main: me.naook1.nereusrealm.NereusRealm
api-version: '1.21'
authors: [naook1, adityap]
description: Custom join/leave, rating, ranks, AFK rewards, daily and menus by naook1/adityap
softdepend: [PlaceholderAPI, LuckPerms, Essentials, CrazyCrates, PlayerKits2, DeluxeMenus, floodgate]

commands:
  nereus:
    description: Menu utama NereusRealm
    aliases: [nereusrealm]
    usage: /<command> [join|leave|daily|kits|ranks|feedback|afk|settings|about|reload]
  afk:
    description: Tandai dirimu AFK
    usage: /<command> [alasan]

permissions:
  nereus.use:
    description: Buka menu /nereus
    default: true
  nereus.afk:
    description: Pakai /afk
    default: true
  nereus.afk.reward:
    description: Dapat reward saat AFK
    default: true
  nereus.afk.exempt:
    description: Tidak kena auto-AFK
    default: false
  nereus.rating:
    description: Boleh memberi rating dan masukan server
    default: true
  nereus.bypass:
    description: Bisa pakai semua join/leave style dan custom message
    default: op
  nereus.admin:
    description: Reload, hapus masukan, dan membuka menu apa saja
    default: op
