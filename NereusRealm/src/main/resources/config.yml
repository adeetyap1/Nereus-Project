# ============================================================
#  NereusRealm
#  Developer : naook1/adityap
#  Server    : 1.21.1 (Paper) | Java 21 | Java + Bedrock (Geyser)
# ============================================================
# Warna: &a &l dll, hex &#RRGGBB. Awali teks dengan [mm] untuk MiniMessage (gradient).
# Placeholder: {player} dll, dan %placeholderapi% kalau PlaceholderAPI terpasang.

developer: "naook1/adityap"
server-name: "Nereus Throne"

# Teks otomatis diubah jadi small caps (ᴄᴏɴᴛᴏʜ ɪɴɪ).
# Matikan kalau mau tulis teks sendiri persis seperti di file.
small-caps:
  gui: true        # gui.yml, ranks.yml, nama hadiah daily
  messages: true   # messages.yml
  styles: true     # styles.yml (join/leave style)

join-leave:
  enabled: true
  join-delay-ticks: 2
  sound-volume: 0.7

# ------------------------------------------------------------
#  REDEEM CODE  (/redeem <kode> atau tombol Redeem di /nereus)
#  Kode dibuat admin: /nereus code create NERUSONTOP1 7d 100
#  lalu atur hadiahnya (lihat /nereus code). Tiap pemain hanya bisa
#  claim 1x per kode. Data kode ada di codes.yml.
# ------------------------------------------------------------
redeem:
  enabled: true
  timezone: "Asia/Makassar"          # zona waktu untuk tanggal expires
  money-command: "eco give {player} {amount}"   # dipakai untuk hadiah uang
  sound: "entity.player.levelup"     # kosongkan untuk tanpa suara
  max-fails: 5                       # salah kode berturut-turut sebelum dikunci
  lock-seconds: 300                  # lama dikunci (anti tebak kode)

kits:
  # Command PlayerKits2 yang dijalankan tombol Kits
  command: "kit"

# ------------------------------------------------------------
#  CUSTOM JOIN/LEAVE MESSAGE (pemain menulis sendiri)
#  Hanya rank di bawah ini (nama group LuckPerms) yang boleh.
#  Pemain klik item "Custom Message" di menu, lalu ketik pesan di chat.
#  Pakai {player} untuk nama pemain (kalau lupa, nama ditaruh di depan otomatis).
# ------------------------------------------------------------
custom-message:
  enabled: true
  # Urutan dari rank TERENDAH ke TERTINGGI. Pemain dihitung punya tier ini kalau
  # ada di group LuckPerms tersebut (group.<nama>) atau punya permission nereus.custom.<nama>.
  ranks:
    duke:
      max-length: 40     # karakter terlihat (kode warna & {player} tidak dihitung)
      colors: false      # boleh kode warna &a &b dst
      formats: false     # boleh &l (tebal) &o (miring) &n &m
      hex: false         # boleh &#RRGGBB
    viscount:
      max-length: 50
      colors: true
      formats: false
      hex: false
    king:
      max-length: 60
      colors: true
      formats: true
      hex: false
    emperor:
      max-length: 80
      colors: true
      formats: true
      hex: true
  # Awalan tetap supaya pesan pemain tidak bisa menyamar jadi pesan sistem/staff
  text-color: "&7"             # warna dasar teks pemain
  join-prefix: "&8[&a+&8] "
  leave-prefix: "&8[&c-&8] "
  join-sound: "entity.player.levelup"
  leave-sound: ""
  convert-small-caps: false     # true = teks pemain otomatis jadi small caps
  cooldown-seconds: 30          # jeda antar perubahan pesan
  # Kata/tautan terlarang (huruf kecil). Tambahkan kata kasar sesuai kebutuhan servermu.
  blocked-words:
    - "http"
    - "www."
    - ".com"
    - ".net"
    - ".gg"
    - ".xyz"

input:
  timeout-seconds: 60           # batas waktu mengetik di chat

# ------------------------------------------------------------
#  RATING & MASUKAN SERVER (bintang 1-5 + pesan, terlihat semua pemain)
# ------------------------------------------------------------
rating:
  enabled: true
  min-playtime-minutes: 30      # minimal waktu bermain sebelum boleh rating (anti spam)
  edit-cooldown-hours: 24       # jeda sebelum boleh mengubah rating
  max-length: 100               # panjang pesan masukan
  blocked-words:
    - "http"
    - "www."
    - ".com"
    - ".net"
    - ".gg"
    - ".xyz"

# ------------------------------------------------------------
#  AFK  (/afk [alasan] atau menu AFK)
# ------------------------------------------------------------
afk:
  enabled: true
  auto-afk-minutes: 5          # 0 = matikan auto AFK
  unafk-on-activity: true      # gerak/chat/command/klik = tidak AFK lagi
  default-reason: "Tidak ada alasan"
  auto-reason: "Tidak aktif"
  max-reason-length: 40
  display:
    actionbar: true            # timer AFK di atas hotbar
    title: true                # judul besar saat mulai AFK
  reward:
    enabled: true
    interval-minutes: 5        # tiap 5 menit AFK dapat reward
    max-afk-minutes: 120       # lewat ini tidak dapat reward lagi (0 = tanpa batas)
    sound: "entity.experience_orb.pickup"
    money:
      enabled: true
      base: 1000               # reward pertama
      increase-per-cycle: 500  # naik tiap siklus (AFK makin lama makin besar)
      max: 10000               # batas atas (0 = tanpa batas)
      # {player} {amount} {minutes} {cycle}
      commands:
        - "eco give {player} {amount}"
    keys:
      enabled: true
      chance: 20.0             # peluang (%) dapat key di tiap siklus
      # Cek syntax CrazyCrates kamu dengan /crates help, lalu sesuaikan.
      # {player} {crate} {amount}
      command: "crates give virtual {crate} {amount} {player}"
      pool:                    # weight = rate relatif antar key
        - crate: "vote"
          display: "&aVote Key"
          weight: 60
          amount: 1
        - crate: "rare"
          display: "&9Rare Key"
          weight: 30
          amount: 1
        - crate: "epic"
          display: "&dEpic Key"
          weight: 10
          amount: 1

# ------------------------------------------------------------
#  DAILY (bawaan NereusRealm, reset tengah malam sesuai timezone)
# ------------------------------------------------------------
daily:
  enabled: true
  timezone: "Asia/Makassar"
  loop: true                   # setelah hari terakhir kembali ke hari 1
  # Lewat sehari = streak ulang dari hari 1.
  # {player} {day}
  rewards:
    1:
      name: "Day 1"
      icon: GOLD_NUGGET
      lore:
        - "&7+ &e$2,000"
      commands:
        - "eco give {player} 2000"
    2:
      name: "Day 2"
      icon: GOLD_INGOT
      lore:
        - "&7+ &e$3,000"
      commands:
        - "eco give {player} 3000"
    3:
      name: "Day 3"
      icon: IRON_INGOT
      lore:
        - "&7+ &e$4,000"
        - "&7+ &f16 Iron Ingot"
      commands:
        - "eco give {player} 4000"
        - "give {player} minecraft:iron_ingot 16"
    4:
      name: "Day 4"
      icon: EMERALD
      lore:
        - "&7+ &e$5,000"
      commands:
        - "eco give {player} 5000"
    5:
      name: "Day 5"
      icon: DIAMOND
      lore:
        - "&7+ &e$7,500"
        - "&7+ &b4 Diamond"
      commands:
        - "eco give {player} 7500"
        - "give {player} minecraft:diamond 4"
    6:
      name: "Day 6"
      icon: GOLDEN_APPLE
      lore:
        - "&7+ &e$10,000"
        - "&7+ &62 Golden Apple"
      commands:
        - "eco give {player} 10000"
        - "give {player} minecraft:golden_apple 2"
    7:
      name: "Day 7 &d(Bonus)"
      icon: CHEST
      lore:
        - "&7+ &e$15,000"
        - "&7+ &b8 Diamond"
      commands:
        - "eco give {player} 15000"
        - "give {player} minecraft:diamond 8"
