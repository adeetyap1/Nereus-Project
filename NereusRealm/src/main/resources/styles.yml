file-version: 1
# styles.yml - Join & Leave style bawaan - Developer: naook1/adityap
#
# Siapa yang boleh pakai style?
#   permission : node LuckPerms (mis. nereus.join.duke)
#   ranks      : nama group LuckPerms. Member group itu boleh pakai.
#   Boleh isi salah satu atau dua-duanya (cukup salah satu terpenuhi).
#   Kosong semua = semua player boleh. (OP / nereus.bypass bebas pakai semua.)
#
# Rank yang lebih tinggi ditulis juga di list "ranks" supaya tetap bisa memakai
# style rank di bawahnya (kalau di LuckPerms kamu tidak pakai inheritance).
# Urutan rank: Duke < Viscount < King < Emperor (sesuai daftar rank).
#
# message : {player} dan placeholder PAPI (mis. %luckperms_prefix%) bisa dipakai.
#           Awali [mm] untuk MiniMessage (gradient).
# sound   : key sound Minecraft (mis. entity.player.levelup), kosong = tanpa suara.
#
# Pesan buatan pemain sendiri diatur di config.yml bagian custom-message.

default-join: default
default-leave: default

first-join:
  enabled: true
  message: "&8[&d★&8] &d{player} &7baru pertama kali bergabung di &6Nereus Throne&7!"

join-styles:
  default:
    name: "&7Default"
    icon: PAPER
    permission: ""
    ranks: []
    message: "&8[&a+&8] &7{player}"
    sound: ""
  duke:
    name: "&aDuke"
    icon: EMERALD
    permission: "nereus.join.duke"
    ranks: ["duke", "viscount", "king", "emperor"]
    message: "&8[&a+&8] &a{player} &7bergabung ke server"
    sound: "entity.experience_orb.pickup"
  viscount:
    name: "&bViscount"
    icon: DIAMOND
    permission: "nereus.join.viscount"
    ranks: ["viscount", "king", "emperor"]
    message: "[mm]<gradient:#00c6ff:#0072ff>✦ Viscount {player} bergabung ke server ✦</gradient>"
    sound: "entity.player.levelup"
  king:
    name: "&6King"
    icon: NETHERITE_INGOT
    permission: "nereus.join.king"
    ranks: ["king", "emperor"]
    message: "[mm]<gradient:#ff9a00:#ffdd00>♛ King {player} telah tiba! ♛</gradient>"
    sound: "ui.toast.challenge_complete"
  emperor:
    name: "&dEmperor"
    icon: NETHER_STAR
    permission: "nereus.join.emperor"
    ranks: ["emperor"]
    message: "[mm]<gradient:#ff00cc:#3333ff>⚔ Sang Emperor {player} memasuki Nereus Throne ⚔</gradient>"
    sound: "entity.ender_dragon.growl"
    sound-pitch: 1.2

leave-styles:
  default:
    name: "&7Default"
    icon: PAPER
    permission: ""
    ranks: []
    message: "&8[&c-&8] &7{player}"
    sound: ""
  duke:
    name: "&aDuke"
    icon: EMERALD
    permission: "nereus.leave.duke"
    ranks: ["duke", "viscount", "king", "emperor"]
    message: "&8[&c-&8] &a{player} &7meninggalkan server"
    sound: ""
  viscount:
    name: "&bViscount"
    icon: DIAMOND
    permission: "nereus.leave.viscount"
    ranks: ["viscount", "king", "emperor"]
    message: "[mm]<gradient:#0072ff:#00c6ff>✦ Viscount {player} meninggalkan server ✦</gradient>"
    sound: ""
  king:
    name: "&6King"
    icon: NETHERITE_INGOT
    permission: "nereus.leave.king"
    ranks: ["king", "emperor"]
    message: "[mm]<gradient:#ffdd00:#ff9a00>♛ King {player} pamit undur diri ♛</gradient>"
    sound: ""
  emperor:
    name: "&dEmperor"
    icon: NETHER_STAR
    permission: "nereus.leave.emperor"
    ranks: ["emperor"]
    message: "[mm]<gradient:#3333ff:#ff00cc>⚔ Sang Emperor {player} meninggalkan takhta ⚔</gradient>"
    sound: ""
